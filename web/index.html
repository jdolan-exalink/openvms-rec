<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenVMS Recorder · Consola VMS</title>
<style>
:root{
  --bg:#080c12;--s1:#0e141f;--s2:#141c2b;--s3:#1b2538;
  --text:#e6edf6;--muted:#8896ab;--line:#232f45;--line2:#334461;
  --accent:#2589ff;--accent-h:#3b9eff;--accent-bg:rgba(37,137,255,.14);
  --ok:#22c55e;--ok-bg:rgba(34,197,94,.14);
  --warn:#f59e0b;--warn-bg:rgba(245,158,11,.14);
  --bad:#ef4444;--bad-bg:rgba(239,68,68,.15);
  --rec:#16a34a;--gap:#ef4444;--na:#3e4c63;
  --shadow:0 8px 28px rgba(0,0,0,.42);
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,monospace;
}
[data-theme="light"]{
  --bg:#eef2f7;--s1:#ffffff;--s2:#f7f9fc;--s3:#edf1f7;
  --text:#111827;--muted:#5a6577;--line:#d5dde8;--line2:#bcc7d6;
  --accent:#0f62fe;--accent-h:#0353e9;--accent-bg:rgba(15,98,254,.10);
  --ok:#15803d;--ok-bg:rgba(21,128,61,.12);
  --warn:#b45309;--warn-bg:rgba(180,83,9,.12);
  --bad:#dc2626;--bad-bg:rgba(220,38,38,.12);
  --rec:#16a34a;--gap:#dc2626;--na:#94a3b8;
  --shadow:0 6px 20px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;
  font:13px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
code{font-family:var(--mono);font-size:12px;background:var(--s3);padding:1px 5px;border-radius:4px;border:1px solid var(--line);word-break:break-all}

/* Top Workstation Bar */
header.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:14px;
  min-height:50px;padding:6px 18px;
  background:var(--s1);
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 12px rgba(0,0,0,.18);
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;padding-right:10px;border-right:1px solid var(--line)}
.brand-mark{
  width:28px;height:28px;border-radius:6px;
  background:linear-gradient(135deg,var(--accent),#0ea5e9);
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 0 14px rgba(37,137,255,.32);flex-shrink:0;
}
.brand-title{display:flex;flex-direction:column;line-height:1.1}
.brand-title strong{font-size:13.5px;font-weight:700;letter-spacing:.02em}
.brand-title span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

nav#nav{display:flex;gap:3px;flex-wrap:wrap}
nav#nav button{
  display:inline-flex;align-items:center;gap:7px;
  background:transparent;border:1px solid transparent;
  color:var(--muted);padding:6px 11px;border-radius:6px;
  cursor:pointer;font:inherit;font-weight:500;transition:all .14s;
}
nav#nav button:hover{color:var(--text);background:var(--s2)}
nav#nav button.on{
  color:#fff;background:var(--accent);border-color:var(--accent);
  box-shadow:0 2px 10px rgba(37,137,255,.28);font-weight:600;
}
[data-theme="light"] nav#nav button.on{color:#fff}

.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sys-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 9px;border-radius:5px;
  background:var(--s2);border:1px solid var(--line);
  color:var(--muted);font-size:11.5px;
}
.clock-chip{
  font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;
  padding:3px 8px;border-radius:5px;background:var(--s2);border:1px solid var(--line);color:var(--text);
}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  width:30px;height:30px;padding:0;
  background:var(--s2);border:1px solid var(--line);color:var(--muted);
  border-radius:7px;cursor:pointer;font:inherit;font-size:12px;transition:all .14s;
}
.icon-btn:hover{color:var(--text);background:var(--s3);border-color:var(--line2)}
.icon-btn.danger-ico:hover{color:var(--bad);border-color:rgba(239,68,68,.45);background:var(--bad-bg)}
#who{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.cfg-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.cfg-tab{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:7px;
  border:1px solid var(--line);background:var(--s1);color:var(--muted);cursor:pointer;
  font:inherit;font-weight:500;transition:all .14s;
}
.cfg-tab:hover{color:var(--text);background:var(--s2);border-color:var(--line2)}
.cfg-tab.on{color:#fff;background:var(--accent);border-color:var(--accent);font-weight:600;box-shadow:0 2px 8px rgba(37,137,255,.25)}
.rec-exp-panel{
  display:grid;grid-template-columns:150px 1fr 1fr 1fr auto;gap:8px;align-items:end;
  padding-top:7px;margin-top:2px;border-top:1px solid var(--line);
}
@media (max-width:1020px){.rec-exp-panel{grid-template-columns:1fr 1fr}}
.rec-exp-field{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);min-width:0}
.rec-exp-field input,.rec-exp-field select{width:100%;padding:4px 7px;font-size:11.5px}
.rec-exp-hint{font-size:10px;color:var(--muted);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Workspace Layout */
main{max-width:1520px;margin:0 auto;padding:16px 20px 28px}
main.nvr-wall{max-width:none;padding:8px 12px 10px}
.card{
  background:var(--s1);border:1px solid var(--line);border-radius:8px;
  padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.12);
}
.card-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line);
}
.card h2,.card-head h2{
  font-size:12px;margin:0;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted);display:flex;align-items:center;gap:7px;
}
.card h2 .sub{text-transform:none;letter-spacing:0;font-weight:400;font-size:12px;color:var(--muted)}
.sub-card{background:var(--s2);border:1px solid var(--line);border-radius:7px;padding:14px;margin-bottom:12px}

/* KPI Strip */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:10px;margin-bottom:14px}
.kpi{
  background:var(--s1);border:1px solid var(--line);border-top:2px solid var(--accent);
  border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;
}
.kpi.ok{border-top-color:var(--ok)}.kpi.warn{border-top-color:var(--warn)}.kpi.bad{border-top-color:var(--bad)}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font-size:22px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .d{font-size:11.5px;color:var(--muted)}
.meter{height:5px;background:var(--s3);border-radius:999px;overflow:hidden;margin-top:4px}
.meter > i{display:block;height:100%;background:var(--accent);border-radius:999px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.stat{background:var(--s2);border:1px solid var(--line);border-radius:7px;padding:10px 12px}
.stat .v{font-size:19px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stat .k{color:var(--muted);font-size:11.5px;margin-top:2px}

/* Tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:var(--s2);white-space:nowrap}
tbody tr:hover td{background:rgba(255,255,255,.02)}
[data-theme="light"] tbody tr:hover td{background:rgba(15,23,42,.025)}

/* Status LEDs & Pills */
.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:2px 8px;border-radius:4px;font-size:11.5px;font-weight:600;
  border:1px solid currentColor;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em;
}
.led{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;flex-shrink:0}
.s-healthy,.s-recording{color:var(--ok);background:var(--ok-bg)}
.s-full,.s-draining,.s-backoff,.s-starting,.s-uninitialized{color:var(--warn);background:var(--warn-bg)}
.s-degraded,.s-missing,.s-stopped{color:var(--bad);background:var(--bad-bg)}
.s-disabled{color:var(--muted);background:var(--s3)}

.ev-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:5px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.ev-chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:5px;
  font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--s2);
  color:var(--text);cursor:pointer;transition:all .12s;
}
.ev-chip:hover{border-color:var(--line2);transform:translateY(-1px)}

/* Timeline */
.tl-wrap{
  position:relative;height:80px;background:var(--bg);
  border:1px solid var(--line2);border-radius:6px;overflow:hidden;
  cursor:crosshair;user-select:none;
}
.tl-wrap svg.tl{width:100%;height:100%;display:block}
.tl-pins{position:absolute;inset:0;pointer-events:none}
.tl-pin{
  position:absolute;top:5px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.45);border:1.5px solid var(--s1);
  pointer-events:auto;cursor:pointer;transition:transform .12s;
}
.tl-pin:hover{transform:translateX(-50%) scale(1.22);z-index:5}
.tl-pin::after{content:"";position:absolute;top:21px;left:50%;transform:translateX(-50%);width:2px;height:44px;background:currentColor;opacity:.75;pointer-events:none}
.tl-hover{position:absolute;top:0;bottom:0;width:1px;background:var(--accent);opacity:.85;pointer-events:none;display:none}
.tl-tip{
  position:absolute;bottom:4px;transform:translateX(-50%);
  background:var(--s1);border:1px solid var(--line2);border-radius:4px;
  padding:2px 7px;font-size:11px;font-family:var(--mono);pointer-events:none;display:none;
  white-space:nowrap;box-shadow:var(--shadow);
}
.tl-ruler{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);padding:4px 2px 0}

/* Capacity Bars */
.bar{position:relative;height:12px;background:var(--s3);border:1px solid var(--line);border-radius:4px;overflow:hidden;min-width:160px}
.bar i{position:absolute;top:0;bottom:0;left:0;background:var(--accent)}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px}

.muted{color:var(--muted)}.small{font-size:12px}.warn{color:var(--warn)}.bad{color:var(--bad)}
.note{
  border-left:3px solid var(--warn);padding:10px 12px;background:var(--warn-bg);
  border-radius:0 6px 6px 0;margin:0 0 12px;font-size:12.5px;
}
.alert-bar{
  border-left:3px solid var(--bad);background:var(--bad-bg);border-radius:0 6px 6px 0;
  padding:10px 14px;margin-bottom:14px;
}

/* Controls */
input,select,.b{
  font:inherit;padding:6px 10px;border:1px solid var(--line2);border-radius:5px;
  background:var(--s2);color:var(--text);transition:border-color .12s,background .12s;
  text-decoration:none;
}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.b{cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:500}
.b:hover{background:var(--s3);border-color:var(--muted)}
.b.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.b.primary:hover{background:var(--accent-h);border-color:var(--accent-h)}
.b.danger{color:var(--bad);border-color:rgba(239,68,68,.4)}
.b.danger:hover{background:var(--bad-bg)}
.b.sm{padding:3px 8px;font-size:12px}
.b:disabled{opacity:.5;cursor:not-allowed}
.seg-group{display:inline-flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden;background:var(--s2)}
.seg-group button{border:0;background:transparent;color:var(--muted);padding:4px 9px;font:inherit;font-size:12px;cursor:pointer;border-right:1px solid var(--line)}
.seg-group button:last-child{border-right:0}
.seg-group button.on{background:var(--accent);color:#fff;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.row:last-child{margin-bottom:0}

/* Video Theater & Live Matrix */
.stage{background:#030508;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.stage-osd{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:7px 12px;background:#0a0f17;border-bottom:1px solid #1d2738;color:#cbd5e1;font-size:12px;
}
video{width:100%;max-height:62vh;display:block;background:#000}
.split-rec{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:1180px){.split-rec{grid-template-columns:1fr}}

/* VMS Pro Live Workspace */
.nvr-shell{display:grid;grid-template-columns:208px minmax(0,1fr);gap:10px;align-items:stretch}
.nvr-shell.sb-off{grid-template-columns:minmax(0,1fr)}
.nvr-shell.sb-off .nvr-sb{display:none}
.nvr-sb{
  background:linear-gradient(180deg,var(--s1),rgba(10,14,22,.96));
  border:1px solid var(--line);border-radius:10px;padding:9px 8px;
  display:flex;flex-direction:column;gap:6px;height:calc(100vh - 80px);min-height:420px;
  box-shadow:0 4px 20px rgba(0,0,0,.18);
}
[data-theme="light"] .nvr-sb{background:var(--s1)}
.nvr-sb-head{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 4px 6px;border-bottom:1px solid var(--line)}
.nvr-sb-head h3{margin:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:5px}
.nvr-sb-list{display:flex;flex-direction:column;gap:2px;overflow-y:auto;padding-right:2px;flex:1}
.tree-nvr{
  display:flex;align-items:center;gap:6px;padding:5px 7px;border:0;
  border-radius:7px;background:rgba(148,163,184,.08);cursor:grab;user-select:none;
  transition:background .14s;
}
.tree-nvr:hover{background:rgba(37,137,255,.14)}
.tree-nvr.dragging{opacity:.5;cursor:grabbing}
.tree-chev{
  background:transparent;border:0;color:var(--muted);padding:0 2px;cursor:pointer;font-size:10px;line-height:1;
}
.tree-nvr-name{font-size:12px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-count{font-family:var(--mono);font-size:9.5px;padding:1px 6px;border-radius:999px;background:rgba(34,197,94,.12);color:var(--ok)}
.tree-branches{
  display:flex;flex-direction:column;gap:1px;margin:2px 0 0 10px;padding-left:8px;
  border-left:1px solid rgba(148,163,184,.18);
}
.tree-branches.collapsed{display:none}
.sb-cam{
  position:relative;display:flex;align-items:center;gap:6px;padding:4px 7px;
  border:0;border-radius:6px;background:transparent;cursor:grab;user-select:none;
  color:var(--muted);transition:background .12s,color .12s;
}
.sb-cam::before{
  content:"";position:absolute;left:-8px;top:50%;width:6px;height:1px;background:rgba(148,163,184,.18);
}
.sb-cam:hover{background:rgba(148,163,184,.12);color:var(--text)}
.sb-cam.in-grid{color:var(--text)}
.sb-cam.in-grid .sb-cam-name{font-weight:700}
.sb-cam.dragging{opacity:.4;cursor:grabbing}
.sb-cam.sb-drop-over{box-shadow:inset 0 2px 0 0 var(--accent);background:rgba(37,137,255,.12)}
.sb-cam-name{flex:1;min-width:0;font-size:12px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-rec-led{
  width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block;
  background:#475569;opacity:.45;
}
.sb-rec-led.on{background:#ef4444;opacity:1;box-shadow:0 0 6px rgba(239,68,68,.75)}
.sb-grip{color:var(--muted);font-size:11px;letter-spacing:-1px;flex-shrink:0;opacity:0;transition:opacity .12s}
.sb-cam:hover .sb-grip{opacity:.55}
.nvr-sb-tip{font-size:10px;color:var(--muted);opacity:.78;line-height:1.35;padding:6px 4px 0;border-top:1px solid var(--line)}

.wm-btn{display:inline-flex!important;align-items:center;gap:5px}
.wm-btn.wm-live.on{background:rgba(22,163,74,.22)!important;color:#4ade80!important;border-color:rgba(74,222,128,.45)}
.wm-btn.wm-rec.on{background:rgba(220,38,38,.22)!important;color:#f87171!important;border-color:rgba(248,113,113,.45)}

.ctx-menu{
  position:fixed;z-index:9999;min-width:205px;padding:5px;border-radius:7px;
  background:var(--s1);border:1px solid var(--line2);box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:2px;
}
.ctx-item{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:transparent;border:0;border-radius:5px;padding:6px 9px;
  color:var(--text);font:inherit;font-size:12px;cursor:pointer;
}
.ctx-item:hover{background:var(--accent);color:#fff}
.ctx-sep{height:1px;background:var(--line);margin:3px 4px}

.nvr-wall-wrap{
  display:flex;flex-direction:column;gap:8px;min-width:0;
  background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:8px;
}
.nvr-wall-wrap:fullscreen{
  background:#020408;border:0;border-radius:0;padding:6px;gap:6px;width:100vw;height:100vh;
}
.nvr-toolbar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  padding:2px 2px 4px;border-bottom:1px solid var(--line);
}
.nvr-tb-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.live{
  display:grid;gap:5px;
  height:calc(100vh - 140px);min-height:420px;
}
.nvr-wall-wrap.rec-mode .live{
  height:calc(100vh - 296px);min-height:280px;
}
.nvr-wall-wrap:fullscreen .live{flex:1;height:auto;min-height:0}
.live.g1,.live.is-focus{grid-template-columns:1fr!important;grid-template-rows:1fr!important}
.live.g2{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.live.g15{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}
.live.g15:not(.is-focus) > :first-child{grid-column:span 2;grid-row:span 2}
.live.g3{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}
.live.g17{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))}
.live.g17:not(.is-focus) > :first-child{grid-column:span 3;grid-row:span 3}
.live.g4{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))}
.live.is-focus > .slot-box:not(.slot-focused){display:none!important}
@media (max-width:960px){
  .nvr-shell{grid-template-columns:1fr}
  .nvr-sb{height:auto;max-height:220px}
  .live,.nvr-wall-wrap.rec-mode .live{height:auto;min-height:0}
  .live.g2,.live.g15,.live.g3,.live.g17,.live.g4{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto}
  .live.g15:not(.is-focus) > :first-child,.live.g17:not(.is-focus) > :first-child{grid-column:span 2;grid-row:auto}
  .slot-box{aspect-ratio:16/9}
}
@media (max-width:600px){
  .live,.live.g2,.live.g15,.live.g3,.live.g17,.live.g4{grid-template-columns:1fr}
  .live.g15:not(.is-focus) > :first-child,.live.g17:not(.is-focus) > :first-child{grid-column:auto}
}

.slot-box{
  position:relative;margin:0;width:100%;height:100%;min-width:0;min-height:0;
  border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#03050a;
  transition:border-color .14s,box-shadow .14s;
}
.slot-box.drop-over{border-color:var(--accent)!important;box-shadow:inset 0 0 0 2px var(--accent)!important}
.slot-box.drop-over::after{
  content:attr(data-drop-hint);position:absolute;inset:0;z-index:8;
  display:flex;align-items:center;justify-content:center;
  background:rgba(15,35,70,.52);color:#e0f2fe;font-size:12.5px;font-weight:700;
  pointer-events:none;backdrop-filter:blur(1px);
}
.slot-box.tile{cursor:grab}
.slot-box.tile.is-dragging{opacity:.42;transform:scale(.985)}
.tile:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tile.has-det{border-color:#f59e0b;box-shadow:0 0 0 1px rgba(245,158,11,.7)}
.slot-empty{
  border-style:dashed;border-color:var(--line2);background:rgba(8,12,20,.68);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:var(--muted);font-size:12px;text-align:center;padding:12px;
}
.slot-empty svg{opacity:.45}
.slot-num{position:absolute;top:7px;left:9px;font-family:var(--mono);font-size:10px;color:var(--muted);opacity:.65}
.tile-stage{position:relative;width:100%;height:100%;background:#03050a;overflow:hidden}
.tile-stage.is-zoomed{cursor:grab}
.tile-stage.is-zoomed.panning{cursor:grabbing}
.tile-zoom-layer{position:absolute;inset:0;transform-origin:center center;will-change:transform}
.tile-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;background:#03050a;transition:opacity .2s ease}
.tile-poster:not([src]){visibility:hidden}
.tile-stage.playing .tile-poster{opacity:0;pointer-events:none}
.tile-vid{position:absolute;inset:0;z-index:0;width:100%;height:100%;max-height:none;object-fit:fill;background:transparent;opacity:0;transition:opacity .16s ease;pointer-events:none}
.tile-vid.ready.is-front{z-index:1;opacity:1}
.tile-osd-top{
  position:absolute;top:0;left:0;right:0;z-index:4;
  display:flex;justify-content:space-between;align-items:center;gap:6px;
  padding:5px 7px;background:linear-gradient(180deg,rgba(2,4,8,.84),rgba(2,4,8,0));
  color:#f1f5f9;font-size:12px;pointer-events:auto;cursor:grab;
}
.tile-osd-left{display:flex;align-items:center;gap:6px;min-width:0;pointer-events:auto;cursor:grab}
.tile-osd-right{display:inline-flex;align-items:center;gap:4px;flex-shrink:0;pointer-events:auto}
.tile-name{display:inline-flex;align-items:center;gap:5px;font-weight:600;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rec-ico{
  display:inline-flex;align-items:center;gap:3px;flex-shrink:0;
  font-family:var(--mono);font-size:9px;font-weight:600;line-height:1;
  padding:2px 5px;border-radius:999px;background:rgba(15,23,42,.42);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.08);color:#cbd5e1;
}
.rec-ico.rec{border-color:rgba(239,68,68,.28);background:rgba(28,12,16,.48);color:#fecaca}
.rec-ico .rec-dot{width:5px;height:5px;border-radius:50%;background:#ef4444;display:inline-block}
.rec-ico:not(.rec) .rec-dot{background:#64748b}
.tile-qual{
  font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.03em;
  padding:2px 6px;border-radius:999px;cursor:pointer;line-height:1.2;
  background:rgba(15,23,42,.45);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);color:#cbd5e1;
  transition:all .14s;
}
.tile-qual.hd{border-color:rgba(96,165,250,.45);color:#bfdbfe;background:rgba(30,58,138,.45)}
.tile-qual:hover{border-color:rgba(255,255,255,.35);color:#fff}
.tile-badge{
  flex-shrink:0;font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.03em;line-height:1.2;
  padding:2px 6px;border-radius:999px;background:rgba(15,23,42,.45);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.1);color:#94a3b8;
}
.tile-badge.is-live{color:#86efac;border-color:rgba(74,222,128,.28);background:rgba(10,32,20,.48)}
.tile-badge.warn{color:#fde68a;border-color:rgba(251,191,36,.28)}
.tile-zoom-btn{
  display:none;align-items:center;gap:2px;font-family:var(--mono);font-size:9px;font-weight:600;
  padding:2px 6px;border-radius:999px;cursor:pointer;line-height:1.2;
  background:rgba(37,137,255,.26);backdrop-filter:blur(6px);border:1px solid rgba(96,165,250,.45);color:#dbeafe;
}
.tile-zoom-btn.on{display:inline-flex}
.tile-zoom-btn:hover{background:var(--accent);color:#fff}
.tile-audio{position:relative;display:inline-flex;align-items:center}
.tile-audio-btn{
  display:inline-flex;align-items:center;justify-content:center;width:20px;height:18px;
  padding:0;border-radius:999px;cursor:pointer;opacity:.76;transition:all .14s;
  background:rgba(15,23,42,.42);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1);color:#cbd5e1;
}
.tile-audio-btn.unmuted{opacity:1;color:#7dd3fc;border-color:rgba(56,189,248,.45);background:rgba(12,50,82,.52)}
.tile-audio-btn:hover{opacity:1;border-color:rgba(255,255,255,.32);color:#fff}
.tile-vol-pop{
  display:none;position:absolute;top:100%;right:0;margin-top:5px;z-index:12;
  padding:5px 8px;border-radius:999px;background:rgba(12,16,24,.88);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.12);box-shadow:var(--shadow);align-items:center;gap:6px;
}
.tile-audio:hover .tile-vol-pop,.tile-audio:focus-within .tile-vol-pop{display:flex}
.tile-vol-pop input[type="range"]{width:68px;height:3px;padding:0;accent-color:var(--accent);cursor:pointer}
.tile-unpin{
  opacity:0;transition:opacity .14s,background .14s,transform .12s;
  width:17px;height:17px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.12);background:rgba(15,23,42,.48);backdrop-filter:blur(6px);
  color:rgba(241,245,249,.82);cursor:pointer;
}
.tile:hover .tile-unpin{opacity:.85}
.tile-unpin:hover{opacity:1!important;background:rgba(255,95,87,.88);border-color:rgba(255,95,87,.95);color:#fff;transform:scale(1.06)}

/* Avigilon-style live detection bounding boxes */
.det-overlay{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.det-box{
  position:absolute;border:1.5px solid #22c55e;border-radius:2px;

}
.det-box.person{border-color:#22c55e}
.det-box.vehicle{border-color:#38bdf8}
.det-box.motion{border-color:#f59e0b;border-style:dashed}
.det-box.alert{border-color:#ef4444}
.det-box-lbl{

/* OpenVMS En Vivo / Grabado Multi-Camera Timeline Dock */
.nvr-tl-dock{
  background:var(--s2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;
  display:flex;flex-direction:column;gap:5px;user-select:none;
}
.nvr-tl-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.nvr-tl-tracks-wrap{
  position:relative;border:1px solid var(--line);border-radius:5px;background:var(--bg);overflow:visible;cursor:crosshair;transition:box-shadow .15s,border-color .15s;
}
.nvr-tl-tracks-wrap.mode-start{border-color:#22c55e;box-shadow:0 0 0 2px rgba(34,197,94,.45)}
.nvr-tl-tracks-wrap.mode-end{border-color:#ef4444;box-shadow:0 0 0 2px rgba(239,68,68,.45)}
.nvr-tl-ruler{
  display:grid;grid-template-columns:110px minmax(0,1fr);border-bottom:1px solid var(--line);border-radius:5px 5px 0 0;overflow:hidden;
  background:var(--s1);font-family:var(--mono);font-size:10px;color:var(--muted);height:20px;align-items:center;
}
.nvr-tl-ruler-ticks{display:flex;justify-content:space-between;padding:0 6px}
.nvr-tl-lane{
  display:grid;grid-template-columns:110px minmax(0,1fr);height:26px;align-items:center;
  border-bottom:1px solid rgba(255,255,255,.04);
}
.nvr-tl-lane:last-child{border-bottom:0}
.nvr-tl-cam{
  padding:0 8px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border-right:1px solid var(--line);height:100%;display:flex;align-items:center;background:var(--s1);
}
.nvr-tl-canvas{position:relative;height:100%;width:100%;overflow:hidden}
.nvr-tl-seg{position:absolute;top:5px;bottom:5px;border-radius:2px;background:rgba(13,148,136,.72)}
.nvr-tl-seg.na{background:rgba(100,116,139,.4)}
.nvr-tl-gap{position:absolute;bottom:1px;height:3px;background:var(--bad);opacity:.85}
.nvr-tl-ev{position:absolute;top:3px;bottom:3px;width:3px;margin-left:-1px;border-radius:1px;z-index:2}
.nvr-tl-playhead{
  position:absolute;top:20px;bottom:0;left:110px;right:0;pointer-events:none;z-index:4;
}
.nvr-tl-sel{
  position:absolute;top:0;bottom:0;background:rgba(34,197,94,.22);
  border-left:2px solid #22c55e;border-right:2px solid #ef4444;pointer-events:none;z-index:1;
}
.nvr-tl-cursor{
  position:absolute;top:0;bottom:0;width:2px;background:#f8fafc;box-shadow:0 0 6px rgba(56,189,248,.9);z-index:4;
}
.nvr-tl-cursor::before{
  content:"";position:absolute;top:-5px;left:-4px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid #38bdf8;
}
.nvr-tl-mark{
  position:absolute;top:0;bottom:0;width:10px;margin-left:-5px;cursor:ew-resize;pointer-events:auto;z-index:6;
  display:flex;align-items:center;justify-content:center;
}
.nvr-tl-mark::before{content:"";position:absolute;top:0;bottom:0;width:2px;border-radius:1px}
.nvr-tl-mark.start::before{background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.75)}
.nvr-tl-mark.end::before{background:#ef4444;box-shadow:0 0 6px rgba(239,68,68,.75)}
.nvr-tl-mark-grip{
  position:relative;width:8px;height:18px;border-radius:2px;border:1px solid rgba(255,255,255,.65);
}
.nvr-tl-mark.start .nvr-tl-mark-grip{background:#16a34a}
.nvr-tl-mark.end .nvr-tl-mark-grip{background:#dc2626}
.nvr-tl-mark-tag{
  position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%);
  padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:10px;font-weight:700;
  color:#fff;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.5);pointer-events:none;
}
.nvr-tl-mark.start .nvr-tl-mark-tag{background:#16a34a}
.nvr-tl-mark.end .nvr-tl-mark-tag{background:#dc2626}

/* OpenVMS Start / End Selection Bar */
.rec-mark-banner{
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:6px;

@keyframes recPulse{0%,100%{opacity:1}50%{opacity:.82}}
.rec-mark-bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:4px;border-top:1px solid var(--line);
}
.rec-step-wrap{display:inline-flex;align-items:center;gap:5px}
.rec-step-badge{
  width:19px;height:19px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;background:var(--s3);color:var(--muted);border:1px solid var(--line2);flex-shrink:0;
}
.rec-step-badge.ok-start{background:#16a34a;color:#fff;border-color:#22c55e}
.rec-step-badge.ok-end{background:#dc2626;color:#fff;border-color:#ef4444}
.b.mark-start{background:#15803d;color:#fff;border-color:#22c55e;font-weight:600}
.b.mark-start:hover{background:#16a34a}
.b.mark-start.picking{box-shadow:0 0 0 2px rgba(134,239,172,.8);background:#22c55e}
.b.mark-end{background:#b91c1c;color:#fff;border-color:#ef4444;font-weight:600}
.b.mark-end:hover:not(:disabled){background:#dc2626}
.b.mark-end.picking{box-shadow:0 0 0 2px rgba(252,165,165,.8);background:#ef4444}
.rec-sel-pill{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:6px;
  background:rgba(22,163,74,.14);border:1px solid rgba(34,197,94,.45);color:#4ade80;font-size:12px;font-weight:600;
}

.ev-mini{
  display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);
  border-radius:6px;background:var(--s2);cursor:pointer;transition:border-color .12s;
}
.ev-mini:hover{border-color:var(--accent)}
.ev-mini-stack{display:flex;flex-direction:column;gap:7px}

.login-wrap{max-width:410px;margin:10vh auto;background:var(--s1);border:1px solid var(--line2);border-radius:10px;padding:24px;box-shadow:var(--shadow)}

.legend span{margin-right:10px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
</style>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GB = 1e9, fmtGB = b => (b / GB).toFixed(b < 10 * GB ? 2 : 1) + " GB";
const fmtT = t => t ? new Date(t).toLocaleString() : "—";
const fmtTime = t => t ? new Date(t).toLocaleTimeString() : "—";
const STATE = {healthy:"sano", full:"lleno", degraded:"degradado", missing:"ausente", disabled:"deshabilitado", draining:"drenando", uninitialized:"sin inicializar", recording:"grabando", backoff:"reconectando", starting:"conectando", stopped:"detenido"};
const WARN = {system_volume:"disco del sistema", network_volume:"volumen de red", removable_volume:"extraíble", no_redundancy_assumed:"sin redundancia", identity_changed:"identidad cambiada"};
const pill = s => `<span class="pill s-${esc(s)}"><i class="led"></i>${esc(STATE[s] || s)}</span>`;

function authHeader(h) {
  if (!key) return h;
  if (key.startsWith("ovs_")) h["Authorization"] = "Bearer " + key;
  else h["X-API-Key"] = key;
  return h;
}
function maybeRefreshSession() {
  if (!key || !key.startsWith("ovs_") || authRequired || document.hidden) return;
  if (Date.now() - lastSessionRefresh < 2 * 3600 * 1000 || refreshInFlight) return;
  refreshInFlight = fetch("/api/v1/auth/refresh", {method: "POST", headers: authHeader({})})
    .then(async r => {
      if (!r.ok) return;
      const d = await r.json().catch(() => null);
      if (d?.token) {
        key = d.token;
        lastSessionRefresh = Date.now();
        sessionStorage.setItem("ovr_key", key);
      }
    })
    .catch(() => {})
    .finally(() => { refreshInFlight = null; });
}
async function api(path, opts = {}) {
  if (authRequired && !opts.authProbe) throw new Error("unauthorized");
  if (!opts.skipRefresh) maybeRefreshSession();
  const h = authHeader(Object.assign({}, opts.headers || {}));
  const r = await fetch(path, Object.assign({}, opts, {headers: h}));
  if (r.status === 401) {
    clearAuth();
    authRequired = true;
    showLogin();
    throw new Error("unauthorized");
  }
  if (!r.ok) {
    let m = r.statusText, c = "";
    try { const e = (await r.json()).error; m = e.message; c = e.code; } catch {}
    if (r.status === 429) {
      clearInterval(timer); timer = null;
      const retry = r.headers.get("Retry-After");
      m = `Demasiados intentos de autenticación fallidos.${retry ? " Reintentá en " + retry + " s o iniciá sesión nuevamente." : " Esperá unos segundos o iniciá sesión nuevamente."}`;
      c = c || "too_many_attempts";
    }
    throw Object.assign(new Error(m), {code: c, status: r.status});
  }
  return opts.raw ? r : r.json();
}

async function refreshWho() {
  const w = $("#who"), lb = $("#logout");
  if (!key) { w.innerHTML = ""; if (lb) lb.hidden = true; return false; }
  try {
    const me = await api("/api/v1/auth/me", {authProbe: true, skipRefresh: true});
    authRequired = false;
    if (lastSessionRefresh === 0 && me.auth_type === "session") lastSessionRefresh = Date.now();
    w.innerHTML = `<span class="sys-chip" title="Usuario activo"><b>${esc(me.username)}</b> <span class="muted">· ${esc(me.role)}</span></span>`;
    if (lb) {
      lb.hidden = false;
      lb.title = `Cerrar sesión (${me.username})`;
      lb.onclick = async () => {
        if (key && key.startsWith("ovs_")) {

function showLogin(msg) {

  if (typeof stopRecordedGrid === "function") stopRecordedGrid();

  if ($("#login")) {

    const username = $("#luser").value.trim(), password = $("#lpass").value;
    $("#lerr").textContent = "";
    try {
      const res = await fetch("/api/v1/auth/login", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({username, password})});
      const d = await res.json().catch(() => ({}));
      if (!res.ok) { $("#lerr").textContent = d.error?.message || "Usuario o contraseña inválidos"; return; }
      key = d.token; sessionStorage.setItem("ovr_key", key);
      authRequired = false;
      lastSessionRefresh = Date.now();
      await refreshWho();
      show(view);
    } catch (e) { $("#lerr").textContent = "Error de conexión"; }
  };
  $("#go").onclick = doLogin;
  $("#lpass").onkeydown = e => { if (e.key === "Enter") doLogin(); };

  };
}

  if (st) {
    st.gen++;
    if (st.pendingPC) { try { st.pendingPC.close(); } catch {} st.pendingPC = null; }
    if (st.pc) { try { st.pc.close(); } catch {} st.pc = null; }
    rtcSlotState.delete(k);

  [document.querySelector(`video[data-slot-va="${slotIdx}"]`), document.querySelector(`video[data-slot-vb="${slotIdx}"]`)].forEach(v => {
    if (!v) return;
    v.srcObject = null;
    v.classList.remove("ready", "is-front");
    v.closest(".tile-stage")?.classList.remove("playing");

function detShortLabel(ev) {

function camRecordingInfo(c, caps) {
  const recStreams = (c.streams || []).filter(s => s.state === "recording");
  const activeRep = recStreams.map(s => s.representation === "main" ? "HD" : "SD");
  const mode = caps?.recording_mode || "continuous";
  const modeLabel = REC_MODES[mode] || "Continuo";
  const allSt = c.streams || [];
  const anyRec = recStreams.length > 0;
  const anyWarn = allSt.some(s => s.state === "backoff" || s.state === "starting");
  const title = anyRec
    ? `Grabando: ${modeLabel}${activeRep.length ? " (" + activeRep.join("+") + ")" : ""}`
    : (anyWarn ? "Conectando stream de grabación…" : "Grabación detenida");
  let modeSvg = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`;
  if (mode === "continuous_with_event_markers") {
    modeSvg = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>`;

    modeSvg = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`;
  }
  return {anyRec, title, modeSvg, text: anyRec ? "REC" : (anyWarn ? "…" : "OFF")};
}

function detBoxClass(type, cls) {
  const k = String(cls || type || "").toLowerCase();
  if (k === "person" || k === "human") return "person";
  if (k === "vehicle" || k === "car" || k === "truck" || k === "bus" || k === "motorcycle" || k === "bicycle") return "vehicle";
  if (k === "motion" || k === "nvr_motion") return "motion";
  return "alert";
}

function renderCamDetBoxesHTML(camId, evItems, refMs, windowMs) {
  const camEv = (evItems || []).filter(x => {
    if (x.camera_id !== camId) return false;
    const t = Date.parse(x.timestamp_utc);
    if (Number.isNaN(t)) return false;
    return Math.abs(refMs - t) <= windowMs;
  });
  if (!camEv.length) return {boxesHTML: "", pillHTML: "", hot: false};

  const boxes = [];
  let noBoxEv = null;
  // Render bounding boxes for active detections cleanly (Avigilon style).
  for (const ev of camEv) {
    const detList = (Array.isArray(ev.detections) && ev.detections.length)
      ? ev.detections
      : ((Array.isArray(ev.bbox) && ev.bbox.length === 4) ? [{class: ev.class || ev.type, confidence: ev.confidence, bbox: ev.bbox}] : []);
    if (!detList.length && !noBoxEv) noBoxEv = ev;
    for (const d of detList) {
      if (!Array.isArray(d.bbox) || d.bbox.length !== 4) continue;
      const [bx, by, bw, bh] = d.bbox.map(Number);
      if (![bx, by, bw, bh].every(Number.isFinite) || bw <= 0 || bh <= 0) continue;
      const left = Math.max(0, Math.min(98, bx * 100)).toFixed(2);
      const top = Math.max(0, Math.min(98, by * 100)).toFixed(2);
      const width = Math.max(2, Math.min(100 - Number(left), bw * 100)).toFixed(2);
      const height = Math.max(2, Math.min(100 - Number(top), bh * 100)).toFixed(2);
      const cls = d.class || ev.class || ev.type;
      const boxCls = detBoxClass(ev.type, cls);
      const lbl = detShortLabel({type: ev.type, class: cls, confidence: d.confidence ?? ev.confidence});
      boxes.push(`<div class="det-box ${boxCls}" style="left:${left}%;top:${top}%;width:${width}%;height:${height}%">
        <span class="det-box-lbl">${detIconSVG(ev.type, cls)}<span>${esc(lbl)}</span></span>
      </div>`);
      if (boxes.length >= 6) break;
    }
    if (boxes.length >= 6) break;
  }
  const pillHTML = (!boxes.length && noBoxEv)
    ? `<span class="tile-det-pill">${detIconSVG(noBoxEv.type, noBoxEv.class)}<span>${esc(detShortLabel(noBoxEv))}</span></span>`
    : "";
  return {boxesHTML: boxes.join(""), pillHTML, hot: true};
}

function renderAlertsHTML(alerts) {
  if (!alerts?.length) return "";

function bindDashEventClicks() {}

function gridCfg() {
  return GRID_PRESETS[matrixGrid] || GRID_PRESETS["2"];
}

function saveLayoutSlots() {
  localStorage.setItem("ovr_slots", JSON.stringify(layoutSlots));
}

function syncLayoutSlots(camItems) {
  const validIds = new Set(camItems.map(c => c.id));
  if (!Array.isArray(layoutSlots)) {
    layoutSlots = camItems.map(c => c.id);
    saveLayoutSlots();
  } else {
    let changed = false;
    layoutSlots = layoutSlots.map(id => {
      if (id && !validIds.has(id)) { changed = true; return null; }
      return id || null;
    });
    if (changed) saveLayoutSlots();
  }
  const needed = gridCfg().count;
  while (layoutSlots.length < needed) layoutSlots.push(null);
}

// Grid prefers SD (sub) when available; maximized (double-clicked) or 1x1 automatically switches to HD (main).
function preferredTileStream(c, slotIdx) {
  const wantHD = matrixGrid === "1" || focusSlot === slotIdx;
  const hasRep = rep => (c.streams || []).some(s => s.representation === rep && s.state === "recording");
  if (wantHD) {
    if (hasRep("main")) return "main";
    if (hasRep("sub")) return "sub";
    return "main";
  }
  const manual = camLiveStreams[slotIdx + ":" + c.id];
  if (manual && hasRep(manual)) return manual;
  if (hasRep("sub")) return "sub";
  if (hasRep("main")) return "main";
  return c.sub_url ? "sub" : "main";
}

function setLiveStreamBadge(slotIdx, rep) {
  const el = document.querySelector(`[data-qual="${slotIdx}"]`);
  if (!el) return;
  const isHD = rep === "main";
  el.textContent = isHD ? "HD" : "SD";
  el.className = "tile-qual " + (isHD ? "hd" : "sd");
  el.dataset.curRep = rep;
}

function closeCtxMenu() {
  $("#nvr-ctx-menu")?.remove();
}
document.addEventListener("click", closeCtxMenu);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    closeCtxMenu();
    if (recSelectionMode !== "none") {
      recSelectionMode = "none";
      updateExportMarkerControls();
    }
  }
});

function openCtxMenu(x, y, items) {
  closeCtxMenu();
  const menu = document.createElement("div");
  menu.id = "nvr-ctx-menu";
  menu.className = "ctx-menu";
  items.forEach(it => {
    if (it === "sep") {
      const sep = document.createElement("div");
      sep.className = "ctx-sep";
      menu.appendChild(sep);
      return;
    }
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "ctx-item";
    btn.textContent = it.label;
    btn.onclick = e => { e.stopPropagation(); closeCtxMenu(); it.action(); };
    menu.appendChild(btn);
  });
  document.body.appendChild(menu);
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  menu.style.left = Math.min(window.innerWidth - mw - 8, Math.max(8, x)) + "px";
  menu.style.top = Math.min(window.innerHeight - mh - 8, Math.max(8, y)) + "px";
}

function renameNVRPrompt() {
  const next = prompt("Nombre de tu NVR:", nvrName);
  if (next === null) return;
  const trimmed = next.trim();
  if (!trimmed) return;
  nvrName = trimmed;
  localStorage.setItem("ovr_nvr_name", nvrName);
  refreshSidebarUI();
}

function assignAllCamerasToGrid() {
  if (!dashCamsCache.length) return;
  if (dashCamsCache.length > gridCfg().count) {
    if (dashCamsCache.length <= 4) matrixGrid = "2";
    else if (dashCamsCache.length <= 6) matrixGrid = "15";
    else if (dashCamsCache.length <= 9) matrixGrid = "3";
    else matrixGrid = "4";
    localStorage.setItem("ovr_grid", matrixGrid);
  }
  focusSlot = null;
  localStorage.removeItem("ovr_focus_slot");
  layoutSlots = orderedDashCams().map(c => c.id);
  while (layoutSlots.length < gridCfg().count) layoutSlots.push(null);
  saveLayoutSlots();
  dash();
}

function openNVRCtxMenu(x, y) {
  openCtxMenu(x, y, [
    {label: "✏️ Renombrar NVR", action: renameNVRPrompt},
    {label: "⊞ Cargar todas las cámaras al mosaico", action: assignAllCamerasToGrid},
    "sep",
    {label: "⚙️ Configurar sistema", action: () => openConfig("sys")},
    {label: "💾 Configurar almacenamiento", action: () => openConfig("storage")}
  ]);
}

function openCameraCtxMenu(x, y, camId, slotIdx = null) {
  const c = dashCamsCache.find(k => k.id === camId);
  const cname = c?.name || camId;
  const items = [];
  if (slotIdx !== null) {
    items.push({label: focusSlot === slotIdx ? "⊞ Restaurar grilla" : "⤢ Maximizar en HD", action: () => toggleFocusSlot(slotIdx)});
    items.push({label: isSlotMuted(slotIdx) ? "🔊 Activar audio" : "🔇 Silenciar audio", action: () => {
      slotAudioMuted.set(String(slotIdx), !isSlotMuted(slotIdx));
      applySlotAudio(slotIdx, camId);
    }});
    items.push({label: "✕ Quitar del cuadro", action: () => {
      slotZoom.delete(String(slotIdx));
      if (focusSlot === slotIdx) { focusSlot = null; localStorage.removeItem("ovr_focus_slot"); }
      clearSlot(slotIdx);
    }});
    items.push("sep");
  } else {
    items.push({label: `📺 Ubicar "${cname}" en vista`, action: () => {
      const count = gridCfg().count;
      let target = layoutSlots.slice(0, count).indexOf(null);
      if (target < 0) target = 0;
      assignCameraToSlot(target, camId);
    }});
  }
  items.push({label: "◷ Ver grabaciones / Timeline", action: () => {
    const count = gridCfg().count;
    if (!layoutSlots.slice(0, count).includes(camId)) assignCameraToSlot(0, camId);
    wallMode = "recorded";
    localStorage.setItem("ovr_wall_mode", wallMode);
    dash();
  }});
  items.push({label: "⚙️ Configurar cámara", action: () => openConfig("cams", camId)});
  openCtxMenu(x, y, items);
}

function bindSidebarEvents() {
  const nvrEl = $("[data-sb-nvr]");
  if (nvrEl) {
    nvrEl.ondragstart = e => {
      if (e.target.closest("#nvr-tree-chev")) { e.preventDefault(); return; }
      dragPayload = {kind: "nvr"};
      nvrEl.classList.add("dragging");
      try { e.dataTransfer.setData("text/plain", "__nvr__"); e.dataTransfer.effectAllowed = "copy"; } catch {}
    };
    nvrEl.ondragend = () => { nvrEl.classList.remove("dragging"); dragPayload = null; };
    nvrEl.oncontextmenu = e => { e.preventDefault(); openNVRCtxMenu(e.clientX, e.clientY); };
    $("#nvr-tree-name")?.addEventListener("dblclick", e => { e.stopPropagation(); renameNVRPrompt(); });
  }
  $("#nvr-tree-chev")?.addEventListener("click", e => {
    e.stopPropagation();
    nvrExpanded = !nvrExpanded;
    localStorage.setItem("ovr_nvr_exp", nvrExpanded ? "1" : "0");
    $("#nvr-tree-branches")?.classList.toggle("collapsed", !nvrExpanded);
    e.currentTarget.textContent = nvrExpanded ? "▾" : "▸";
  });

  document.querySelectorAll("[data-sb-cam]").forEach(el => {
    const camId = el.dataset.sbCam;
    el.ondragstart = e => {
      dragPayload = {kind: "cam", camId};
      el.classList.add("dragging");
      try { e.dataTransfer.setData("text/plain", camId); e.dataTransfer.effectAllowed = "copyMove"; } catch {}
    };
    el.ondragend = () => {
      el.classList.remove("dragging");
      document.querySelectorAll(".sb-drop-over, .drop-over").forEach(x => x.classList.remove("sb-drop-over", "drop-over"));
      dragPayload = null;
    };
    el.ondragover = e => {
      if (dragPayload?.kind !== "cam" || dragPayload.camId === camId) return;
      e.preventDefault();
      document.querySelectorAll(".sb-drop-over").forEach(x => x.classList.remove("sb-drop-over"));
      el.classList.add("sb-drop-over");
    };
    el.ondragleave = () => el.classList.remove("sb-drop-over");
    el.ondrop = e => {
      if (dragPayload?.kind !== "cam" || dragPayload.camId === camId) return;
      e.preventDefault();
      e.stopPropagation();
      el.classList.remove("sb-drop-over");
      const srcId = dragPayload.camId;
      dragPayload = null;
      const list = orderedDashCams().map(x => x.id);
      const fromIdx = list.indexOf(srcId), toIdx = list.indexOf(camId);
      if (fromIdx >= 0 && toIdx >= 0) {
        list.splice(fromIdx, 1);
        list.splice(toIdx, 0, srcId);
        camOrder = list;
        localStorage.setItem("ovr_cam_order", JSON.stringify(camOrder));
        refreshSidebarUI();
      }
    };
    el.oncontextmenu = e => { e.preventDefault(); openCameraCtxMenu(e.clientX, e.clientY, camId, null); };
    el.onclick = () => {
      const count = gridCfg().count;
      const existing = layoutSlots.slice(0, count).indexOf(camId);
      if (existing >= 0) {
        const box = document.querySelector(`[data-slot="${existing}"]`);
        box?.classList.add("drop-over");
        setTimeout(() => box?.classList.remove("drop-over"), 450);
        return;
      }
      let target = layoutSlots.slice(0, count).indexOf(null);
      if (target < 0) target = 0;
      assignCameraToSlot(target, camId);
    };
  });
}

function refreshSidebarUI() {
  const listEl = $("#nvr-sb-list");
  if (!listEl) return;
  listEl.innerHTML = renderSidebarHTML();
  bindSidebarEvents();
}

function toggleFocusSlot(slotIdx) {
  const grid = $("#live-grid");
  if (!grid) return;
  const camId = layoutSlots[slotIdx];
  if (!camId) return;
  const camObj = dashCamsCache.find(x => x.id === camId);
  if (focusSlot === slotIdx) {
    focusSlot = null;
    localStorage.removeItem("ovr_focus_slot");
    grid.classList.remove("is-focus");
    grid.querySelectorAll("[data-slot]").forEach(s => s.classList.remove("slot-focused"));
    if (wallMode === "live" && camObj && matrixGrid !== "1") {
      const targetRep = preferredTileStream(camObj, slotIdx);
      setLiveStreamBadge(slotIdx, targetRep);
      startSlotWebRTC(slotIdx, camId, targetRep);
    }
  } else {
    focusSlot = slotIdx;
    localStorage.setItem("ovr_focus_slot", String(slotIdx));
    grid.classList.add("is-focus");
    grid.querySelectorAll("[data-slot]").forEach(s => s.classList.toggle("slot-focused", Number(s.dataset.slot) === slotIdx));
    if (wallMode === "live" && camObj) {
      const targetRep = preferredTileStream(camObj, slotIdx);
      setLiveStreamBadge(slotIdx, targetRep);
      startSlotWebRTC(slotIdx, camId, targetRep);
    }
  }
}

const slotZoom = new Map();

function applySlotZoom(slotIdx, z, panX, panY) {
  const k = String(slotIdx);
  const slotEl = document.querySelector(`[data-slot="${slotIdx}"]`);
  const stage = slotEl?.querySelector(".tile-stage");
  const layer = slotEl?.querySelector(`[data-slot-zoom="${slotIdx}"]`);
  const resetBtn = slotEl?.querySelector(`[data-zoom-reset="${slotIdx}"]`);
  if (!stage || !layer) return;

  let nextZ = Math.max(1.0, Math.min(8.0, Math.round(z * 100) / 100));
  let nx = panX, ny = panY;
  if (nextZ <= 1.04) {
    nextZ = 1.0; nx = 0; ny = 0;
    slotZoom.delete(k);
  } else {
    const rect = stage.getBoundingClientRect();
    const maxX = Math.max(0, (rect.width * (nextZ - 1)) / 2);
    const maxY = Math.max(0, (rect.height * (nextZ - 1)) / 2);
    nx = Math.max(-maxX, Math.min(maxX, nx));
    ny = Math.max(-maxY, Math.min(maxY, ny));
    slotZoom.set(k, {z: nextZ, x: nx, y: ny});
  }

  layer.style.transform = nextZ > 1 ? `translate(${nx.toFixed(1)}px, ${ny.toFixed(1)}px) scale(${nextZ})` : "";
  stage.classList.toggle("is-zoomed", nextZ > 1);
  if (slotEl.dataset.slotCam) slotEl.draggable = nextZ <= 1.04;
  if (resetBtn) {
    resetBtn.classList.toggle("on", nextZ > 1);
    resetBtn.textContent = `${Math.round(nextZ * 100)}% ↺`;
  }

  // Seamless adaptive stream promotion (1x..8x): double-buffered swap avoids black flash.
  const camId = layoutSlots[slotIdx];
  const camObj = camId ? dashCamsCache.find(x => x.id === camId) : null;
  if (wallMode === "live" && camObj && matrixGrid !== "1" && focusSlot !== slotIdx && !camLiveStreams[slotIdx + ":" + camId]) {
    const hasMain = camObj.streams?.some(s => s.representation === "main" && s.state === "recording");
    const hasSub = camObj.streams?.some(s => s.representation === "sub" && s.state === "recording");
    const qualBtn = slotEl.querySelector(`[data-qual="${slotIdx}"]`);
    if (hasMain && hasSub && qualBtn) {
      const wantRep = nextZ > 1.8 ? "main" : "sub";
      if (qualBtn.dataset.curRep !== wantRep) {
        setLiveStreamBadge(slotIdx, wantRep);
        startSlotWebRTC(slotIdx, camId, wantRep);
      }
    }
  }
}

function bindSlotEvents(slotEl) {
  const slotIdx = Number(slotEl.dataset.slot);
  slotEl.ondragover = e => {
    e.preventDefault();
    if (dragPayload?.kind === "slot" && dragPayload.slotIdx === slotIdx) return;
    try { e.dataTransfer.dropEffect = dragPayload?.kind === "cam" || dragPayload?.kind === "nvr" ? "copy" : "move"; } catch {}
    document.querySelectorAll(".slot-box.drop-over").forEach(el => { if (el !== slotEl) el.classList.remove("drop-over"); });
    if (dragPayload?.kind === "nvr") {
      slotEl.dataset.dropHint = "⊞ Cargar todas las cámaras";
    } else if (layoutSlots[slotIdx]) {
      slotEl.dataset.dropHint = dragPayload?.kind === "slot" ? "⇄ Intercambiar" : "↻ Reemplazar";
    } else {
      slotEl.dataset.dropHint = dragPayload?.kind === "slot" ? "→ Mover aquí" : "+ Soltar aquí";
    }
    slotEl.classList.add("drop-over");
  };
  slotEl.ondragleave = e => {
    if (e.relatedTarget && !slotEl.contains(e.relatedTarget)) slotEl.classList.remove("drop-over");
  };
  slotEl.ondrop = e => {
    e.preventDefault();
    document.querySelectorAll(".slot-box.drop-over, .slot-box.is-dragging").forEach(el => el.classList.remove("drop-over", "is-dragging"));
    const txt = e.dataTransfer?.getData("text/plain") || "";
    let data = dragPayload;
    if (!data && txt) {
      if (txt === "__nvr__") data = {kind: "nvr"};
      else if (txt.startsWith("__slot__:")) data = {kind: "slot", slotIdx: Number(txt.slice(9))};
      else data = {kind: "cam", camId: txt};
    }
    dragPayload = null;
    if (!data) return;
    if (data.kind === "nvr") {
      assignAllCamerasToGrid();
    } else if (data.kind === "cam" && data.camId) {
      assignCameraToSlot(slotIdx, data.camId);
    } else if (data.kind === "slot" && Number.isFinite(data.slotIdx) && data.slotIdx !== slotIdx) {
      swapSlots(data.slotIdx, slotIdx);
    }
  };

  if (slotEl.dataset.slotCam) {
    slotEl.ondragstart = e => {
      if (e.target.closest("button, input, .tile-audio, .tile-vol-pop")) { e.preventDefault(); return; }
      const zcur = slotZoom.get(String(slotIdx));
      if (zcur && zcur.z > 1.04 && !e.target.closest(".tile-osd-top")) { e.preventDefault(); return; }
      dragPayload = {kind: "slot", slotIdx};
      slotEl.classList.add("is-dragging");
      try {
        e.dataTransfer.setData("text/plain", "__slot__:" + slotIdx);
        e.dataTransfer.effectAllowed = "move";
      } catch {}
    };
    slotEl.ondragend = () => {
      dragPayload = null;
      document.querySelectorAll(".slot-box.drop-over, .slot-box.is-dragging").forEach(el => el.classList.remove("drop-over", "is-dragging"));
    };
  }

  const qualBtn = slotEl.querySelector("[data-qual]");
  if (qualBtn) {
    qualBtn.onclick = e => {
      e.stopPropagation();
      const camId = qualBtn.dataset.camId;
      const camObj = dashCamsCache.find(x => x.id === camId);
      const hasMain = camObj?.streams?.some(s => s.representation === "main" && s.state === "recording");
      const hasSub = camObj?.streams?.some(s => s.representation === "sub" && s.state === "recording");
      if (!hasMain || !hasSub) return;
      const nextRep = qualBtn.dataset.curRep === "main" ? "sub" : "main";
      camLiveStreams[slotIdx + ":" + camId] = nextRep;
      setLiveStreamBadge(slotIdx, nextRep);
      if (wallMode === "live") startSlotWebRTC(slotIdx, camId, nextRep);
    };
  }

  slotEl.querySelector("[data-zoom-reset]")?.addEventListener("click", e => {
    e.stopPropagation();
    applySlotZoom(slotIdx, 1.0, 0, 0);
  });

  slotEl.querySelector("[data-audio-toggle]")?.addEventListener("click", e => {
    e.stopPropagation();
    const camId = layoutSlots[slotIdx];
    if (!camId) return;
    slotAudioMuted.set(String(slotIdx), !isSlotMuted(slotIdx));
    applySlotAudio(slotIdx, camId);
  });

  slotEl.querySelector("[data-audio-vol]")?.addEventListener("input", e => {
    e.stopPropagation();
    const camId = layoutSlots[slotIdx];
    if (!camId) return;
    const v = Math.max(0, Math.min(1, Number(e.target.value) || 0));
    audioPrefs[camId] = {volume: v};
    localStorage.setItem("ovr_audio_prefs", JSON.stringify(audioPrefs));
    if (v > 0 && isSlotMuted(slotIdx)) slotAudioMuted.set(String(slotIdx), false);
    applySlotAudio(slotIdx, camId);
  });

  slotEl.querySelector("[data-unpin]")?.addEventListener("click", e => {
    e.stopPropagation();
    slotZoom.delete(String(slotIdx));
    slotAudioMuted.delete(String(slotIdx));
    if (focusSlot === slotIdx) { focusSlot = null; localStorage.removeItem("ovr_focus_slot"); }
    clearSlot(slotIdx);
  });

  const stage = slotEl.querySelector(".tile-stage");
  if (slotEl.dataset.slotCam && stage) {
    slotEl.oncontextmenu = e => {
      e.preventDefault();
      openCameraCtxMenu(e.clientX, e.clientY, slotEl.dataset.slotCam, slotIdx);
    };

    stage.addEventListener("wheel", e => {
      e.preventDefault();
      e.stopPropagation();
      const cur = slotZoom.get(String(slotIdx)) || {z: 1.0, x: 0, y: 0};
      const step = cur.z >= 3 ? 0.5 : 0.25;
      const delta = e.deltaY < 0 ? step : -step;
      const nextZ = Math.max(1.0, Math.min(8.0, cur.z + delta));
      const rect = stage.getBoundingClientRect();
      const cx = e.clientX - (rect.left + rect.width / 2);
      const cy = e.clientY - (rect.top + rect.height / 2);
      const ratio = nextZ / cur.z;
      const nx = cx - (cx - cur.x) * ratio;
      const ny = cy - (cy - cur.y) * ratio;
      applySlotZoom(slotIdx, nextZ, nx, ny);
    }, {passive: false});

    stage.addEventListener("mousedown", e => {
      if (e.button !== 0 || e.target.closest("button, input, [data-drag-slot]")) return;
      const cur = slotZoom.get(String(slotIdx));
      if (!cur || cur.z <= 1.04) return;
      e.preventDefault();
      stage.classList.add("panning");
      const sx = e.clientX, sy = e.clientY, bx = cur.x, by = cur.y, bz = cur.z;
      const onMove = ev => applySlotZoom(slotIdx, bz, bx + (ev.clientX - sx), by + (ev.clientY - sy));
      const onUp = () => {
        stage.classList.remove("panning");
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
      };
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });

    slotEl.ondblclick = e => {
      if (e.target.closest("button, input")) return;
      toggleFocusSlot(slotIdx);
    };

    const existingZ = slotZoom.get(String(slotIdx));
    if (existingZ && existingZ.z > 1.04) applySlotZoom(slotIdx, existingZ.z, existingZ.x, existingZ.y);
  }
}

function remountSlot(slotIdx) {
  stopSlotRTC(slotIdx);
  stopSlotRecHLS(slotIdx);
  const grid = $("#live-grid");
  if (!grid) return;
  const oldEl = grid.querySelector(`[data-slot="${slotIdx}"]`);
  if (!oldEl) return;
  const tpl = document.createElement("div");
  tpl.innerHTML = slotHTML(slotIdx);
  const newEl = tpl.firstElementChild;
  oldEl.replaceWith(newEl);
  bindSlotEvents(newEl);
  const camId = layoutSlots[slotIdx];
  if (camId) {
    const camObj = dashCamsCache.find(x => x.id === camId);
    refreshThumb(camId);
    if (wallMode === "live" && camObj && camObj.enabled !== false) {
      startSlotWebRTC(slotIdx, camId, preferredTileStream(camObj, slotIdx));
    } else if (wallMode === "recorded") {
      loadAndRenderRecordedTimeline().then(() => playRecordedSlotAt(slotIdx, camId, recPlayheadMs));
    }
  } else if (wallMode === "recorded") {
    loadAndRenderRecordedTimeline();
  }
}

function assignCameraToSlot(slotIdx, camId) {
  if (!dashCamsCache.some(c => c.id === camId)) return;
  while (layoutSlots.length <= slotIdx) layoutSlots.push(null);
  layoutSlots[slotIdx] = camId;
  saveLayoutSlots();
  remountSlot(slotIdx);
  refreshSidebarUI();
}

function clearSlot(slotIdx) {
  layoutSlots[slotIdx] = null;
  saveLayoutSlots();
  remountSlot(slotIdx);
  refreshSidebarUI();
}

function swapSlots(a, b) {
  while (layoutSlots.length <= Math.max(a, b)) layoutSlots.push(null);
  const tmp = layoutSlots[a];
  layoutSlots[a] = layoutSlots[b];
  layoutSlots[b] = tmp;
  const za = slotZoom.get(String(a)), zb = slotZoom.get(String(b));
  if (zb) slotZoom.set(String(a), zb); else slotZoom.delete(String(a));
  if (za) slotZoom.set(String(b), za); else slotZoom.delete(String(b));
  const ma = slotAudioMuted.get(String(a)), mb = slotAudioMuted.get(String(b));
  if (mb !== undefined) slotAudioMuted.set(String(a), mb); else slotAudioMuted.delete(String(a));
  if (ma !== undefined) slotAudioMuted.set(String(b), ma); else slotAudioMuted.delete(String(b));
  saveLayoutSlots();
  remountSlot(a);
  remountSlot(b);
  refreshSidebarUI();
}

// ── Recorded Multi-Camera Grid + Synchronized Timeline (OpenVMS style) ──
function recWindowBounds() {
  const half = (recSpanHours * 3600e3) / 2;
  let endMs = recAnchorMs + half;
  const nowMs = Date.now();
  if (endMs > nowMs) endMs = nowMs;
  const startMs = endMs - recSpanHours * 3600e3;
  return {startMs, endMs};
}

function activeGridSlotPairs() {
  const count = gridCfg().count;
  const out = [];
  for (let i = 0; i < count; i++) {
    const camId = layoutSlots[i];
    if (camId) out.push({slotIdx: i, camId, cam: dashCamsCache.find(x => x.id === camId)});
  }
  return out;
}

async function loadAndRenderRecordedTimeline() {
  const dock = $("#nvr-tl-dock");
  if (!dock || wallMode !== "recorded") return;
  const {startMs, endMs} = recWindowBounds();
  const fromISO = new Date(startMs).toISOString();
  const toISO = new Date(endMs).toISOString();
  const pairs = activeGridSlotPairs();
  const uniqueCams = [...new Set(pairs.map(p => p.camId))];

  await Promise.all(uniqueCams.map(async camId => {
    try {
      const [recData, evData] = await Promise.all([
        api(`/api/v1/cameras/${encodeURIComponent(camId)}/recordings?from=${encodeURIComponent(fromISO)}&to=${encodeURIComponent(toISO)}`),
        api(`/api/v1/cameras/${encodeURIComponent(camId)}/events?from=${encodeURIComponent(fromISO)}&to=${encodeURIComponent(toISO)}&limit=300`).catch(() => ({items: []}))
      ]);
      recTimelineCache.set(camId, {
        intervals: recData.intervals || [],
        gaps: recData.gaps || [],
        events: evData.items || []
      });
    } catch {
      recTimelineCache.set(camId, {intervals: [], gaps: [], events: []});
    }
  }));

  const span = Math.max(1, endMs - startMs);
  const pct = ms => Math.max(0, Math.min(100, (ms - startMs) / span * 100));
  const ticks = [];
  for (let k = 0; k <= 6; k++) {
    const t = new Date(startMs + (span * k) / 6);
    ticks.push(`<span>${t.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", hour12: false})}</span>`);
  }

  const lanesHTML = pairs.length ? pairs.map(p => {
    const d = recTimelineCache.get(p.camId) || {intervals: [], gaps: [], events: []};
    const segs = d.intervals.map(it => {
      const l = pct(Date.parse(it.start)), r = pct(Date.parse(it.end));
      return `<div class="nvr-tl-seg ${it.available ? "" : "na"}" style="left:${l.toFixed(2)}%;width:${Math.max(0.3, r - l).toFixed(2)}%"></div>`;
    }).join("");
    const gaps = d.gaps.map(g => {
      const l = pct(Date.parse(g.start)), r = pct(Date.parse(g.end || toISO));
      return `<div class="nvr-tl-gap" style="left:${l.toFixed(2)}%;width:${Math.max(0.4, r - l).toFixed(2)}%"></div>`;
    }).join("");
    const evs = d.events.slice(0, 120).map(ev => {
      const l = pct(Date.parse(ev.timestamp_utc));
      const m = evMeta(ev.type);
      return `<div class="nvr-tl-ev" style="left:${l.toFixed(2)}%;background:${m.color}" title="${esc(m.label)} · ${esc(fmtTime(ev.timestamp_utc))}"></div>`;
    }).join("");
    return `<div class="nvr-tl-lane">
      <div class="nvr-tl-cam" title="${esc(p.cam?.name || p.camId)}">${esc(p.cam?.name || p.camId)}</div>
      <div class="nvr-tl-canvas">${segs}${gaps}${evs}</div>
    </div>`;
  }).join("") : `<div class="nvr-tl-lane"><div class="nvr-tl-cam muted">Sin cámaras</div><div class="nvr-tl-canvas"></div></div>`;

  const wrap = $("#nvr-tl-tracks-wrap");
  if (wrap) {
    wrap.className = "nvr-tl-tracks-wrap" + (recSelectionMode === "start" ? " mode-start" : recSelectionMode === "end" ? " mode-end" : "");
    wrap.innerHTML = `
      <div class="nvr-tl-ruler">
        <div style="padding:0 8px;border-right:1px solid var(--line)">Cámara</div>
        <div class="nvr-tl-ruler-ticks">${ticks.join("")}</div>
      </div>
      ${lanesHTML}
      <div class="nvr-tl-playhead" id="nvr-tl-playhead">
        <div class="nvr-tl-sel" id="nvr-tl-sel" hidden></div>
        <div class="nvr-tl-cursor" id="nvr-tl-cursor" style="left:${pct(recPlayheadMs).toFixed(3)}%"></div>
        <div class="nvr-tl-mark start" id="nvr-tl-mark-start" title="Arrastrá para ajustar el inicio" hidden>
          <div class="nvr-tl-mark-tag" id="nvr-tl-mark-start-tag"></div>
          <div class="nvr-tl-mark-grip"></div>
        </div>
        <div class="nvr-tl-mark end" id="nvr-tl-mark-end" title="Arrastrá para ajustar el fin" hidden>
          <div class="nvr-tl-mark-tag" id="nvr-tl-mark-end-tag"></div>
          <div class="nvr-tl-mark-grip"></div>
        </div>
      </div>
    `;
    bindTimelineScrubber(wrap, startMs, endMs);
    updateExportMarkerVisuals(startMs, endMs);
  }
  updateRecordedPlayheadUI();
  updateExportMarkerControls();
}

const fmtMarkTime = ms => Number.isFinite(ms) ? new Date(ms).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false}) : "--:--:--";
function fmtSelDuration(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
  return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
}

function updateExportMarkerVisuals(startMs, endMs) {
  if (!Number.isFinite(startMs) || !Number.isFinite(endMs)) {
    const b = recWindowBounds();
    startMs = b.startMs; endMs = b.endMs;
  }
  const span = Math.max(1, endMs - startMs);
  const wrap = $("#nvr-tl-tracks-wrap");
  if (wrap) {
    wrap.classList.toggle("mode-start", recSelectionMode === "start");
    wrap.classList.toggle("mode-end", recSelectionMode === "end");
  }
  const selEl = $("#nvr-tl-sel");
  const stEl = $("#nvr-tl-mark-start"), stTag = $("#nvr-tl-mark-start-tag");
  const enEl = $("#nvr-tl-mark-end"), enTag = $("#nvr-tl-mark-end-tag");

  if (stEl) {
    if (recMarkStartMs !== null && recMarkStartMs >= startMs && recMarkStartMs <= endMs) {
      stEl.hidden = false;
      stEl.style.left = ((recMarkStartMs - startMs) / span * 100).toFixed(3) + "%";
      if (stTag) stTag.textContent = fmtMarkTime(recMarkStartMs);
    } else {
      stEl.hidden = true;
    }
  }
  if (enEl) {
    if (recMarkEndMs !== null && recMarkEndMs >= startMs && recMarkEndMs <= endMs) {
      enEl.hidden = false;
      enEl.style.left = ((recMarkEndMs - startMs) / span * 100).toFixed(3) + "%";
      if (enTag) enTag.textContent = fmtMarkTime(recMarkEndMs);
    } else {
      enEl.hidden = true;
    }
  }
  if (selEl) {
    if (recMarkStartMs !== null && recMarkEndMs !== null && recMarkEndMs > recMarkStartMs && recMarkEndMs > startMs && recMarkStartMs < endMs) {
      const l = Math.max(0, (recMarkStartMs - startMs) / span * 100);
      const r = Math.min(100, (recMarkEndMs - startMs) / span * 100);
      selEl.hidden = false;
      selEl.style.left = l.toFixed(3) + "%";
      selEl.style.width = Math.max(0.2, r - l).toFixed(3) + "%";
    } else {
      selEl.hidden = true;
    }
  }
}

function updateExportMarkerControls() {
  const banner = $("#rec-mark-banner"), bannerTxt = $("#rec-mark-banner-txt");
  if (banner) {
    banner.hidden = recSelectionMode === "none";
    banner.className = "rec-mark-banner " + (recSelectionMode === "start" ? "start" : recSelectionMode === "end" ? "end" : "");
    if (bannerTxt) {
      bannerTxt.textContent = recSelectionMode === "start"
        ? "Hacé clic en cualquier punto de la línea de tiempo para fijar el INICIO del clip"
        : "Hacé clic en cualquier punto posterior al inicio para fijar el FIN del clip";
    }
  }

  const b1Num = $("#rec-step1-num"), b1 = $("#rec-step1-btn"), b1Txt = $("#rec-step1-txt");
  const b2Num = $("#rec-step2-num"), b2 = $("#rec-step2-btn"), b2Txt = $("#rec-step2-txt");
  if (b1Num) {
    b1Num.className = "rec-step-badge" + (recMarkStartMs !== null ? " ok-start" : "");
    b1Num.textContent = recMarkStartMs !== null ? "✓" : "1";
  }
  if (b1) b1.classList.toggle("picking", recSelectionMode === "start");
  if (b1Txt) b1Txt.textContent = recMarkStartMs !== null ? fmtMarkTime(recMarkStartMs) : "Marcar Inicio";

  if (b2Num) {
    b2Num.className = "rec-step-badge" + (recMarkEndMs !== null ? " ok-end" : "");
    b2Num.textContent = recMarkEndMs !== null ? "✓" : "2";
  }
  if (b2) {
    b2.disabled = recMarkStartMs === null;
    b2.classList.toggle("picking", recSelectionMode === "end");
  }
  if (b2Txt) b2Txt.textContent = recMarkEndMs !== null ? fmtMarkTime(recMarkEndMs) : "Marcar Fin";

  const hasSel = recMarkStartMs !== null && recMarkEndMs !== null && recMarkEndMs > recMarkStartMs;
  const selWrap = $("#rec-sel-pill"), selDur = $("#rec-sel-dur"), hintEl = $("#rec-mark-hint");
  const camSel = $("#rec-exp-cam"), clearSelBtn = $("#rec-clear-marks"), goBtn = $("#rec-exp-go");
  if (selWrap) selWrap.hidden = !hasSel;
  if (selDur && hasSel) selDur.textContent = fmtSelDuration(recMarkEndMs - recMarkStartMs);
  if (hintEl) hintEl.hidden = hasSel || recSelectionMode !== "none";
  if (camSel) camSel.hidden = !hasSel;
  if (clearSelBtn) clearSelBtn.hidden = (recMarkStartMs === null && recMarkEndMs === null);
  if (goBtn) {
    goBtn.hidden = !hasSel;
    goBtn.disabled = !hasSel || recExportBusy;
    if (hasSel) goBtn.textContent = `✂ Exportar (${fmtSelDuration(recMarkEndMs - recMarkStartMs)})`;
  }
  updateExportMarkerVisuals();
}

function bindTimelineScrubber(wrap, startMs, endMs) {
  let dragKind = null; // null | "playhead" | "start" | "end"
  const tsFromX = clientX => {
    const rect = wrap.getBoundingClientRect();
    const trackLeft = rect.left + 110;
    const trackW = Math.max(1, rect.width - 110);
    const ratio = Math.max(0, Math.min(1, (clientX - trackLeft) / trackW));
    return Math.round(startMs + ratio * (endMs - startMs));
  };

  $("#nvr-tl-mark-start")?.addEventListener("mousedown", e => {
    e.preventDefault();
    e.stopPropagation();
    dragKind = "start";
  });
  $("#nvr-tl-mark-end")?.addEventListener("mousedown", e => {
    e.preventDefault();
    e.stopPropagation();
    dragKind = "end";
  });

  wrap.onmousedown = e => {
    if (e.clientX - wrap.getBoundingClientRect().left < 110) return;
    const ts = tsFromX(e.clientX);
    if (recSelectionMode === "start") {
      recMarkStartMs = ts;
      if (recMarkEndMs !== null && recMarkStartMs >= recMarkEndMs) recMarkEndMs = null;
      recSelectionMode = "none";
      updateExportMarkerControls();
      return;
    }
    if (recSelectionMode === "end") {
      if (recMarkStartMs !== null && ts <= recMarkStartMs) {
        const msg = $("#rec-exp-msg");
        if (msg) msg.innerHTML = `<span class="warn">Elegí un punto posterior al inicio (${esc(fmtMarkTime(recMarkStartMs))}).</span>`;
        return;
      }
      recMarkEndMs = ts;
      recSelectionMode = "none";
      const msg = $("#rec-exp-msg");
      if (msg) msg.textContent = "";
      updateExportMarkerControls();
      return;
    }
    dragKind = "playhead";
    seekRecordedGrid(ts);
  };
  window.onmousemove = e => {
    if (!dragKind) return;
    const ts = tsFromX(e.clientX);
    if (dragKind === "playhead") {
      seekRecordedGrid(ts);
    } else if (dragKind === "start") {
      recMarkStartMs = Math.min(ts, recMarkEndMs !== null ? recMarkEndMs - 1000 : endMs);
      updateExportMarkerControls();
    } else if (dragKind === "end") {
      recMarkEndMs = Math.max(ts, recMarkStartMs !== null ? recMarkStartMs + 1000 : startMs);
      updateExportMarkerControls();
    }
  };
  window.onmouseup = () => { dragKind = null; };
}

function updateRecordedPlayheadUI() {
  const lbl = $("#rec-ts-lbl");
  if (lbl) lbl.textContent = fmtT(recPlayheadMs);
  const cur = $("#nvr-tl-cursor");
  if (cur) {
    const {startMs, endMs} = recWindowBounds();
    const p = Math.max(0, Math.min(100, (recPlayheadMs - startMs) / Math.max(1, endMs - startMs) * 100));
    cur.style.left = p.toFixed(3) + "%";
  }
  for (const {slotIdx, camId} of activeGridSlotPairs()) {
    const d = recTimelineCache.get(camId);
    const boxEl = document.querySelector(`[data-slot-boxes="${slotIdx}"]`);
    const detEl = document.querySelector(`[data-slot-det="${slotIdx}"]`);
    const tileEl = document.querySelector(`[data-slot="${slotIdx}"]`);
    if (d && boxEl) {
      const res = renderCamDetBoxesHTML(camId, d.events, recPlayheadMs, 3500);
      boxEl.innerHTML = res.boxesHTML;
      if (detEl) detEl.innerHTML = res.pillHTML;
      tileEl?.classList.toggle("has-det", res.hot);
    }
  }
}

async function playRecordedSlotAt(slotIdx, camId, targetMs, opts = {}) {
  if (wallMode !== "recorded" || view !== "dash") return;
  const k = String(slotIdx);
  const vid = activeSlotVid(slotIdx);
  const msgEl = document.querySelector(`[data-slot-msg="${slotIdx}"]`);
  if (!vid) return;

  const existing = recHlsMap.get(k);
  if (existing && existing.camId === camId && targetMs >= existing.winStartMs + 2000 && targetMs <= existing.winEndMs - 5000 && existing.playlistStartMs) {
    const offset = Math.max(0, (targetMs - existing.playlistStartMs) / 1000);
    if (Math.abs((vid.currentTime || 0) - offset) > 1.8) {
      try { vid.currentTime = offset; } catch {}
    }
    vid.playbackRate = recSpeed;
    applySlotAudio(slotIdx, camId);
    if (recPlaying) vid.play().catch(() => {}); else vid.pause();
    return;
  }

  stopSlotRecHLS(slotIdx);
  if (msgEl) msgEl.textContent = "Cargando grabación…";
  setLiveBadge(slotIdx, "CARGANDO", "warn");

  const winStartMs = targetMs - 5e3;
  const winEndMs = Math.min(Date.now(), targetMs + 25 * 60e3);
  const compat = opts.compatFallback || !hevcOK;
  try {
    const p = await api(`/api/v1/cameras/${encodeURIComponent(camId)}/playback?from=${new Date(winStartMs).toISOString()}&to=${new Date(winEndMs).toISOString()}${compat ? "&compat=1" : ""}`, {method: "POST"});
    if (wallMode !== "recorded" || view !== "dash" || layoutSlots[slotIdx] !== camId) return;
    if (p.segments === 0) {
      if (msgEl) msgEl.textContent = "Sin grabación en este instante";
      setLiveBadge(slotIdx, "SIN VIDEO", "");
      return;
    }
    const url = location.origin + p.url;
    const pStartMs = p.playlist_start ? Date.parse(p.playlist_start) : winStartMs;
    const seekSec = Math.max(0, (targetMs - pStartMs) / 1000);
    if (msgEl) msgEl.textContent = "";
    setLiveBadge(slotIdx, p.compat ? "H.264" : "VOD", "is-live");

    if (window.Hls && Hls.isSupported()) {
      const inst = new Hls({maxBufferLength: 24, startPosition: seekSec > 1 ? seekSec : -1});
      recHlsMap.set(k, {hls: inst, camId, winStartMs, winEndMs, playlistStartMs: pStartMs});
      inst.on(Hls.Events.ERROR, (_, data) => {
        if (!data.fatal) return;
        if (!p.compat && !opts.compatFallback) {
          playRecordedSlotAt(slotIdx, camId, targetMs, {compatFallback: true});
          return;
        }
        if (msgEl) msgEl.textContent = "Error al decodificar grabación";
        setLiveBadge(slotIdx, "ERR", "warn");
      });
      inst.loadSource(url);
      inst.attachMedia(vid);
      inst.on(Hls.Events.MANIFEST_PARSED, () => {
        if (seekSec > 1) { try { vid.currentTime = seekSec; } catch {} }
        vid.playbackRate = recSpeed;
        vid.classList.add("ready", "is-front");
        vid.closest(".tile-stage")?.classList.add("playing");
        applySlotAudio(slotIdx, camId);
        if (recPlaying) vid.play().catch(() => {}); else vid.pause();
      });
    } else if (vid.canPlayType("application/vnd.apple.mpegurl")) {
      recHlsMap.set(k, {hls: null, camId, winStartMs, winEndMs, playlistStartMs: pStartMs});
      vid.src = url;
      vid.classList.add("ready", "is-front");
      vid.closest(".tile-stage")?.classList.add("playing");
      vid.addEventListener("loadedmetadata", () => {
        if (seekSec > 1) { try { vid.currentTime = seekSec; } catch {} }
        vid.playbackRate = recSpeed;
        applySlotAudio(slotIdx, camId);
        if (recPlaying) vid.play().catch(() => {}); else vid.pause();
      }, {once: true});
    }
  } catch (err) {
    if (msgEl) msgEl.textContent = "Sin grabación disponible";
    setLiveBadge(slotIdx, "SIN VIDEO", "");
  }
}

async function seekRecordedGrid(targetMs) {
  recPlayheadMs = Math.min(Date.now() - 2000, targetMs);
  localStorage.setItem("ovr_rec_playhead", String(recPlayheadMs));
  updateRecordedPlayheadUI();
  const pairs = activeGridSlotPairs();
  await Promise.all(pairs.map(p => playRecordedSlotAt(p.slotIdx, p.camId, recPlayheadMs)));
}

function startRecordedClock() {
  if (recClockTimer) clearInterval(recClockTimer);
  recClockTimer = setInterval(() => {
    if (view !== "dash" || wallMode !== "recorded" || !recPlaying) return;
    let syncedFromPrimary = false;
    for (const [k, entry] of recHlsMap.entries()) {
      const v = activeSlotVid(Number(k));
      if (v && !v.paused && Number.isFinite(v.currentTime) && entry.playlistStartMs) {
        recPlayheadMs = entry.playlistStartMs + v.currentTime * 1000;
        syncedFromPrimary = true;
        break;
      }
    }
    if (!syncedFromPrimary) recPlayheadMs = Math.min(Date.now(), recPlayheadMs + 500 * recSpeed);
    localStorage.setItem("ovr_rec_playhead", String(Math.round(recPlayheadMs)));
    updateRecordedPlayheadUI();
  }, 500);
}

      const ex = activeRecExport;
      const clipLbl = (ex.request?.name || "").trim() || (ex.request?.camera_id || "clip");
      if (ex.state === "queued" || ex.state === "running") {
        const pctNum = Math.round((ex.progress || 0) * 100);
        msgEl.innerHTML = `<span class="warn num">Exportando “${esc(clipLbl)}”… ${pctNum}%</span><button type="button" class="b sm danger" id="rec-exp-cancel-job">✕ Cancelar exportación</button>`;

          bEv.currentTarget.disabled = true;

          activeRecExport = Object.assign({}, ex, {state: "cancelled"});
          renderActiveRecExportStatus();
        };
      } else if (ex.state === "succeeded") {
        msgEl.innerHTML = `<span class="s-healthy" style="padding:2px 8px;border-radius:4px">✓ Exportación lista (“${esc(clipLbl)}”)</span><button type="button" class="b sm" id="rec-exp-goto">Ver en Exportaciones →</button>`;

        msgEl.innerHTML = `<span class="warn">Exportación cancelada (“${esc(clipLbl)}”).</span>`;
      } else {
        msgEl.innerHTML = `<span class="bad">✗ ${esc(ex.error || ex.state)}</span>`;
      }
    };

    const pollActiveRecExport = async id => {
      if (recExpPollTimer) clearTimeout(recExpPollTimer);
      try {
        const fresh = await api(`/api/v1/exports/${encodeURIComponent(id)}`);
        activeRecExport = fresh;
        renderActiveRecExportStatus();
        if ((fresh.state === "queued" || fresh.state === "running") && view === "dash" && wallMode === "recorded") {
          recExpPollTimer = setTimeout(() => pollActiveRecExport(id), 800);
        }
      } catch {}
    };

    const startMarkedExport = async (camId, fromMs, toMs, name) => {
      const msgEl = $("#rec-exp-msg");
      if (!camId) { if (msgEl) msgEl.innerHTML = `<span class="bad">Elegí una cámara.</span>`; return; }
      recExportBusy = true;
      updateExportMarkerControls();

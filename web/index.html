<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenVMS Recorder</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#1b1f24;--muted:#5d6670;--line:#dfe3e8;--accent:#1f6feb;--ok:#1a7f37;--warn:#9a6700;--bad:#cf222e;--rec:#2da44e;--gap:#cf222e;--na:#8c959f}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--text:#e6edf3;--muted:#8d96a0;--line:#30363d;--accent:#4493f8;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--rec:#3fb950;--gap:#f85149;--na:#6e7681}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:var(--bg);color:var(--text);font-weight:600}
#who{margin-left:auto;color:var(--muted);font-size:12px}
main{max-width:1200px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.card h2{font-size:14px;margin:0 0 12px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat .v{font-size:22px;font-weight:600}.stat .k{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid currentColor}
.s-healthy,.s-recording{color:var(--ok)}.s-full,.s-draining,.s-backoff,.s-starting,.s-uninitialized{color:var(--warn)}.s-degraded,.s-missing,.s-stopped{color:var(--bad)}.s-disabled{color:var(--muted)}
.bar{position:relative;height:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:160px}
.bar i{position:absolute;top:0;bottom:0;left:0;background:var(--accent)}.bar b{position:absolute;top:-2px;bottom:-2px;width:2px}
.muted{color:var(--muted)}.small{font-size:12px}.warn{color:var(--warn)}.bad{color:var(--bad)}
.note{border-left:3px solid var(--warn);padding:8px 12px;background:var(--bg);margin:0 0 12px}
input,select,button.b{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)}
button.b{cursor:pointer}button.b.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
svg.tl{width:100%;height:56px;cursor:crosshair;display:block}
video{width:100%;max-height:60vh;background:#000;border-radius:6px}
#login{max-width:420px;margin:12vh auto}code{font-size:12px;word-break:break-all}
.legend span{margin-right:14px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
</style>
</head>
<body>
<header>
  <h1>OpenVMS Recorder</h1>
  <nav id="nav">
    <button data-v="dash" class="on">Panel</button>
    <button data-v="cams">Cámaras</button>
    <button data-v="rec">Grabaciones</button>
    <button data-v="storage">Almacenamiento</button>
  </nav>
  <span id="who"></span>
</header>
<main id="main"></main>

<template id="t-login">
  <div class="card" id="login">
    <h2>Acceso</h2>
    <p class="muted small">Esta instancia exige una API key. Creala en el servidor con <code>openvms-recorder apikey create NOMBRE</code>. Se guarda solo en esta pestaña.</p>
    <div class="row"><input id="key" type="password" placeholder="ovr_…" style="flex:1" autocomplete="off"><button class="b primary" id="go">Entrar</button></div>
    <p class="bad small" id="lerr"></p>
  </div>
</template>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GB = 1e9, fmtGB = b => (b / GB).toFixed(b < 10 * GB ? 2 : 1) + " GB";
const fmtT = t => t ? new Date(t).toLocaleString() : "—";
const STATE = {healthy:"sano", full:"lleno", degraded:"degradado", missing:"ausente", disabled:"deshabilitado", draining:"drenando", uninitialized:"sin inicializar", recording:"grabando", backoff:"reconectando", starting:"conectando", stopped:"detenido"};
const WARN = {system_volume:"disco del sistema", network_volume:"volumen de red", removable_volume:"extraíble", no_redundancy_assumed:"sin redundancia", identity_changed:"identidad cambiada"};
const pill = s => `<span class="pill s-${esc(s)}">${esc(STATE[s] || s)}</span>`;

let key = sessionStorage.getItem("ovr_key") || "";
async function api(path, opts = {}) {
  const h = Object.assign({}, opts.headers || {});
  if (key) h["X-API-Key"] = key;
  const r = await fetch(path, Object.assign({}, opts, {headers: h}));
  if (r.status === 401) { showLogin(); throw new Error("unauthorized"); }
  if (!r.ok) { let m = r.statusText, code; try { const j = (await r.json()).error; m = j.message; code = j.code } catch {} const e = new Error(m); e.code = code; throw e; }
  return opts.raw ? r : r.json();
}

function showLogin(msg) {
  $("#main").replaceChildren($("#t-login").content.cloneNode(true));
  if (msg) $("#lerr").textContent = msg;
  $("#go").onclick = async () => {
    key = $("#key").value.trim(); sessionStorage.setItem("ovr_key", key);
    try { await api("/api/v1/system/capabilities"); show(view); } catch (e) { $("#lerr").textContent = "API key inválida"; }
  };
}

let view = "dash", timer;
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => show(b.dataset.v));
function show(v) {
  view = v; clearInterval(timer); timer = null;
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  const fn = ({dash, cams, rec, storage})[v];
  fn().catch(e => { if (e.message !== "unauthorized") $("#main").innerHTML = `<div class="card bad">${esc(e.message)}</div>`; });
  // One poller per view, owned here; a refresh never schedules another, and
  // a slow refresh is skipped instead of piling up requests.
  if (v === "dash" || v === "cams") {
    let busy = false;
    timer = setInterval(async () => {
      if (busy || view !== v || document.hidden || (v === "cams" && $("#form")?.children.length)) return;
      busy = true;
      try { await fn(); } catch {} finally { busy = false; }
    }, 10000);
  }
}

async function dash() {
  const [sum, cams, caps] = await Promise.all([api("/api/v1/storage"), api("/api/v1/cameras"), api("/api/v1/system/capabilities")]);
  $("#who").textContent = `v${caps.version} · ${caps.os}/${caps.arch}`;
  const streams = cams.items.flatMap(c => c.streams);
  const rec = streams.filter(s => s.state === "recording").length;
  const kbps = streams.reduce((a, s) => a + (s.bitrate_kbps || 0), 0);
  const gbDay = kbps / 1000 * 10.8;
  const days = gbDay > 0 ? (sum.effective_limit_bytes / GB / gbDay) : null;
  $("#main").innerHTML = `
  ${sum.alerts.length ? `<div class="card"><h2 class="bad">Alertas</h2>${sum.alerts.map(a => `<div>${esc(a.code)} ${a.camera_id ? "· " + esc(a.camera_id) : ""} — ${esc(a.message)}</div>`).join("")}</div>` : ""}
  <div class="card"><div class="grid">
    <div class="stat"><div class="v">${rec}/${streams.length}</div><div class="k">streams grabando</div></div>
    <div class="stat"><div class="v">${(kbps / 1000).toFixed(1)} Mbps</div><div class="k">bitrate total (≈${gbDay.toFixed(1)} GB/día)</div></div>
    <div class="stat"><div class="v">${sum.writable_volumes}/${sum.volumes}</div><div class="k">volúmenes escribibles</div></div>
    <div class="stat"><div class="v">${fmtGB(sum.recorder_bytes)}</div><div class="k">grabado de ${fmtGB(sum.effective_limit_bytes)} utilizables</div></div>
    <div class="stat"><div class="v">${days ? days.toFixed(1) + " d" : "—"}</div><div class="k">retención estimada al bitrate actual</div></div>
  </div></div>
  <div class="card"><h2>Cámaras</h2>${camTable(cams.items)}</div>`;
}

function camTable(items) {
  if (!items.length) return `<p class="muted">No hay cámaras. Agregalas en la pestaña Cámaras.</p>`;
  return `<table><tr><th>Cámara</th><th>Stream</th><th>Estado</th><th>Bitrate</th><th>Segmentos</th><th>Reconexiones</th><th>Última escritura</th><th>Audio</th></tr>
  ${items.flatMap(c => (c.streams.length ? c.streams : [{}]).map(s => `<tr>
    <td><b>${esc(c.name || c.id)}</b><div class="muted small">${esc(c.id)}</div></td>
    <td>${esc(s.representation || "—")}<div class="muted small">${esc(s.source || "")}</div></td>
    <td>${s.state ? pill(s.state) : pill(c.enabled ? "stopped" : "disabled")}${s.last_error ? `<div class="bad small">${esc(s.last_error)}</div>` : ""}</td>
    <td>${s.bitrate_kbps ? (s.bitrate_kbps / 1000).toFixed(2) + " Mbps" : "—"}</td>
    <td>${s.segments ?? "—"}</td><td>${s.reconnects ?? "—"}</td><td class="small">${fmtT(s.last_write)}</td><td>${esc(s.audio || "—")}</td></tr>`)).join("")}</table>`;
}

async function cams() {
  const c = await api("/api/v1/cameras");
  $("#main").innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Cámaras</h2><span class="row" style="margin:0"><label class="small" title="Además del multicast ONVIF, consulta una por una las IP de la subred (sirve cuando el multicast no llega)"><input id="sweep" type="checkbox" checked> barrer la subred</label><button class="b" id="find">Buscar cámaras</button><button class="b" id="addnvr">Agregar NVR</button><button class="b primary" id="add">Agregar a mano</button></span></div>
  <div id="disc"></div>
  <div id="form"></div>
  <p class="muted small">Las capacidades de cada cámara (ONVIF, Profile G, microSD, analíticas) se informan solo con evidencia de pruebas reales; ninguna está confirmada todavía.</p>
  <table><tr><th>Cámara</th><th>Origen</th><th>URL principal</th><th>Estado</th><th></th></tr>
  ${c.items.map(x => `<tr><td><b>${esc(x.name || x.id)}</b><div class="muted small">${esc(x.id)}</div></td>
    <td class="small">${x.source === "api" ? "UI / API" : "archivo YAML"}</td>
    <td class="small"><code>${esc(x.main_url)}</code>${x.has_credentials ? `<div class="muted">con credenciales</div>` : ""}</td>
    <td>${x.streams.length ? x.streams.map(s => pill(s.state)).join(" ") : pill(x.enabled ? "stopped" : "disabled")}${x.events_status ? `<div class="small ${x.events_status.state === "subscribed" ? "s-healthy" : "warn"}" title="${esc(x.events_status.last_error || "")}">eventos: ${esc(EVSTATE[x.events_status.state] || x.events_status.state)}${x.events_status.events ? " · " + x.events_status.events : ""}</div>` : ""}</td>
    <td>${x.editable ? `<button class="b" data-edit="${esc(x.id)}">Editar</button> <button class="b" data-del="${esc(x.id)}">Eliminar</button>` : `<span class="muted small">editar en recorder.yaml</span>`}</td></tr>`).join("")}
  </table></div>
  <div class="card"><h2>Estado de grabación</h2>${camTable(c.items)}</div>`;
  $("#add").onclick = () => camForm();
  $("#find").onclick = () => discover($("#sweep").checked);
  $("#addnvr").onclick = () => nvrForm();
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => camForm(c.items.find(x => x.id === b.dataset.edit)));
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm(`¿Eliminar la cámara ${b.dataset.del}? Si ya tiene grabaciones no se puede: deshabilitala.`)) return;
    try { await api(`/api/v1/cameras/${encodeURIComponent(b.dataset.del)}`, {method: "DELETE", raw: true}); cams(); }
    catch (e) { alert(e.message); }
  });
}

// Credentials typed during this page session, reused for the next camera of the
// same site. Kept in memory only: never stored in the browser.
let lastCreds = {username: "", password: ""};
const EVSTATE = {connecting: "conectando", subscribed: "suscripto", backoff: "reintentando", stopped: "detenido"};
const VIA = {multicast: "multicast ONVIF", sweep: "barrido de subred"};
async function discover(sweep) {
  const d = $("#disc");
  d.innerHTML = `<div class="card" style="background:var(--bg)"><p class="muted">Buscando cámaras ONVIF en la red${sweep ? " (multicast y barrido de subred)" : ""}…</p></div>`;
  try {
    const r = await api("/api/v1/cameras/discover", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({sweep})});
    const nics = r.interfaces.map(i => `${esc(i.name)} ${esc(i.prefix)}${i.swept ? " (barrida)" : ""}${i.error ? ` <span class="bad">${esc(i.error)}</span>` : ""}`).join(" · ");
    d.innerHTML = `<div class="card" style="background:var(--bg)"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Encontradas: ${r.devices.length}</h2><button class="b" id="disc-close">Cerrar</button></div>
      <p class="muted small">Interfaces: ${nics || "ninguna"}. Solo aparecen equipos con ONVIF habilitado.${r.devices.length ? "" : " Si no aparece ninguna, probá con el barrido de subred o agregala a mano con su IP."}</p>
      ${r.devices.length ? `<table><tr><th>IP</th><th>Equipo</th><th>Encontrada por</th><th></th></tr>${r.devices.map((x, i) => `<tr>
        <td><code>${esc(x.address)}</code></td>
        <td>${esc([x.manufacturer, x.hardware].filter(Boolean).join(" ") || "—")}<div class="muted small">${esc(x.name || "")}</div></td>
        <td class="small">${esc(VIA[x.via] || x.via)}</td>
        <td>${x.camera_id ? `<span class="muted small">ya agregada como <b>${esc(x.camera_id)}</b></span>` : x.allowed ? `<button class="b primary" data-disc="${i}">Agregar</button>` : `<span class="warn small">fuera de las redes permitidas (discovery.allowed_networks)</span>`}</td></tr>`).join("")}</table>` : ""}</div>`;
    $("#disc-close").onclick = () => { d.innerHTML = ""; };
    d.querySelectorAll("[data-disc]").forEach(b => b.onclick = () => {
      const x = r.devices[+b.dataset.disc];
      camForm(null, {host: x.address, xaddr: (x.xaddrs || [])[0] || "", name: x.name || x.hardware || ""});
      $("#form").scrollIntoView({behavior: "smooth"});
    });
  } catch (e) { d.innerHTML = `<div class="card" style="background:var(--bg)"><p class="bad">No se pudo buscar: ${esc(e.message)}</p></div>`; }
}
function nvrForm() {
  const f = $("#form");
  f.innerHTML = `<div class="card" style="background:var(--bg)"><h2>Importar canales de un NVR Provision-ISR</h2>
    <p class="muted small">NVR con plataforma TVT NVMS-9000 (probado en NVR8-16400AN). Solo lectura: no se cambia nada en el NVR. Cada canal elegido se graba como una cámara, con el RTSP del NVR.</p>
    <div class="row">
      <label class="small">IP del NVR <input id="n-host" placeholder="192.168.1.20" style="width:150px"></label>
      <label class="small">Puerto web <input id="n-port" type="number" min="1" max="65535" value="80" style="width:80px"></label>
      <label class="small"><input id="n-https" type="checkbox"> HTTPS</label>
      <label class="small">Usuario <input id="n-user" autocomplete="off" value="${esc(lastCreds.username)}" style="width:120px"></label>
      <label class="small">Contraseña <input id="n-pass" type="password" autocomplete="new-password" style="width:140px"></label>
      <button class="b primary" id="n-read">Leer NVR</button><button class="b" id="n-cancel">Cancelar</button>
    </div>
    <div id="n-res" class="small"></div></div>`;
  $("#n-cancel").onclick = () => { f.innerHTML = ""; };
  $("#n-read").onclick = async () => {
    const r = $("#n-res"), host = $("#n-host").value.trim(), user = $("#n-user").value.trim(), pass = $("#n-pass").value;
    if (!host || !user) { r.innerHTML = `<span class="bad">Escribí la IP y el usuario del NVR</span>`; return; }
    r.textContent = "Leyendo el NVR…";
    let d;
    try {
      d = await api("/api/v1/nvrs/detect", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({host, port: +$("#n-port").value || 0, https: $("#n-https").checked, username: user, password: pass})});
    } catch (e) { r.innerHTML = `<span class="bad">✗ ${esc(NVRERR[e.code] || e.message)}</span>`; return; }
    lastCreds = {username: user, password: pass};
    const oct = host.split(".").pop();
    r.innerHTML = `<div class="s-healthy">✓ ${esc(d.name || "NVR")} · ${esc(d.model)}${d.firmware ? " · firmware " + esc(d.firmware) : ""}${d.rtsp_codec ? " · video " + esc(d.rtsp_codec) : ""}</div>
      ${d.rtsp_port ? "" : `<div class="bad">El servidor RTSP del NVR está apagado: activalo en el NVR para poder grabar sus canales.</div>`}
      <details><summary class="muted">Capacidades (${d.capabilities.length})</summary>${d.capabilities.map(x => `<div>${esc(x.capability)}: <b>${esc(CAPSTATE[x.status] || x.status)}</b> <span class="muted">${esc(x.evidence || "")}</span></div>`).join("")}</details>
      <table><tr><th></th><th>Canal</th><th>Nombre de la cámara</th><th>Cámara en el NVR</th><th>Estado</th></tr>
      ${d.channels.map((c, i) => `<tr><td>${c.camera_id ? "" : c.main_url ? `<input type="checkbox" data-ch="${i}" ${c.online === false ? "" : "checked"}>` : ""}</td>
        <td>${c.number || "—"}</td>
        <td>${c.camera_id ? `<span class="muted">ya agregado como <b>${esc(c.camera_id)}</b></span>` : `<input data-name="${i}" value="${esc(c.name || "Canal " + c.number)}" style="width:100%">`}</td>
        <td class="small">${esc([c.manufacturer, c.model].filter(Boolean).join(" ") || "—")}<div class="muted">${esc(c.address || "")}</div></td>
        <td>${c.online === undefined ? "—" : c.online ? `<span class="pill s-healthy">en línea</span>` : `<span class="pill s-stopped">sin conexión</span>`}</td></tr>`).join("")}</table>
      <div class="row" style="margin-top:8px"><button class="b primary" id="n-import">Agregar los elegidos</button><span id="n-out"></span></div>`;
    $("#n-import").onclick = async () => {
      const out = [];
      for (const cb of r.querySelectorAll("[data-ch]:checked")) {
        const c = d.channels[+cb.dataset.ch], name = r.querySelector(`[data-name="${cb.dataset.ch}"]`).value.trim();
        const id = slug(`nvr-${oct}-ch${c.number}`);
        try {
          await api("/api/v1/cameras", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({
            id, name: name || `Canal ${c.number}`, main_url: c.main_url, sub_url: c.sub_url, rtsp_transport: "tcp", audio: "auto",
            enabled: true, priority: 5, username: user, password: pass})});
          out.push(`<span class="s-healthy">✓ ${esc(id)}</span>`);
        } catch (e) { out.push(`<span class="bad">✗ ${esc(id)}: ${esc(e.message)}</span>`); }
      }
      if (!out.length) { $("#n-out").innerHTML = `<span class="muted">No elegiste ningún canal</span>`; return; }
      const ok = !out.some(x => x.includes("bad"));
      if (ok) { cams(); } else { $("#n-out").innerHTML = out.join(" "); }
    };
  };
}
const NVRERR = {auth_failed: "el NVR rechazó el usuario o la contraseña", locked: "el NVR bloqueó la cuenta por intentos fallidos; esperá unos minutos",
  unsupported: "el equipo no es un NVR Provision-ISR / TVT NVMS-9000", not_activated: "el NVR no está activado: terminá su configuración inicial",
  unreachable: "el NVR no respondió en esa IP y puerto", busy: "hay otra prueba en curso; reintentá en unos segundos"};
const slug = t => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 63);
const ONVIFERR = {auth_failed: "la cámara rechazó el usuario o la contraseña (revisá también que ONVIF esté habilitado y que el usuario tenga permiso ONVIF)",
  probe_failed: "la cámara no respondió por ONVIF en esa IP y puerto (¿ONVIF deshabilitado o puerto distinto de 80?)", busy: "hay otra prueba en curso; reintentá en unos segundos"};
const CAPSTATE = {confirmed: "confirmada", unsupported: "no soportada", unknown: "anunciada, sin probar", error: "error"};

const AUDIO = {auto: "automático (copia o AAC si hace falta)", copy: "copiar", aac: "convertir a AAC", none: "sin audio"};
function camForm(cam, seed) {
  const edit = !!cam, v = cam || {enabled: true, rtsp_transport: "tcp", audio: "auto", priority: 5};
  const f = $("#form");
  const host0 = seed ? seed.host : (() => { try { return new URL(String(v.main_url || "").replace(/^rtsps?:/, "http:")).hostname } catch { return "" } })();
  f.innerHTML = `<div class="card" style="background:var(--bg)"><h2>${edit ? "Editar " + esc(v.id) : "Nueva cámara"}</h2>
    <div class="row">
      <label class="small">IP de la cámara (ONVIF) <input id="f-host" value="${esc(host0)}" placeholder="192.168.1.10" style="width:150px"></label>
      <label class="small">Puerto <input id="f-oport" type="number" min="1" max="65535" value="80" style="width:80px"></label>
      <button class="b" id="f-onvif">Leer por ONVIF</button>
      <span class="muted small">Completa modelo y URLs solo, con el usuario y la contraseña de abajo.</span>
    </div>
    <div id="f-onvif-res" class="small" style="margin-bottom:8px"></div>
    <div class="grid">
      <label class="small">Identificador<br><input id="f-id" value="${esc(v.id || "")}" ${edit ? "disabled" : ""} placeholder="entrada-norte" pattern="[a-z0-9][a-z0-9-]*" style="width:100%"></label>
      <label class="small">Nombre<br><input id="f-name" value="${esc(v.name || "")}" style="width:100%"></label>
      <label class="small">Usuario<br><input id="f-user" autocomplete="off" placeholder="${edit && v.has_credentials ? "sin cambios" : ""}" style="width:100%"></label>
      <label class="small">Contraseña<br><input id="f-pass" type="password" autocomplete="new-password" placeholder="${edit && v.has_credentials ? "sin cambios" : ""}" style="width:100%"></label>
    </div>
    <div class="grid" style="margin-top:8px">
      <label class="small">URL RTSP principal<br><input id="f-main" value="${esc(v.main_url || "")}" placeholder="rtsp://192.168.1.10:554/ruta" style="width:100%"></label>
      <label class="small">URL RTSP secundaria (opcional)<br><input id="f-sub" value="${esc(v.sub_url || "")}" style="width:100%"></label>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="small">Transporte <select id="f-tr"><option>tcp</option><option>udp</option></select></label>
      <label class="small">Audio <select id="f-audio">${Object.entries(AUDIO).map(([k, t]) => `<option value="${k}">${t}</option>`).join("")}</select></label>
      <label class="small">Prioridad <input id="f-prio" type="number" min="0" max="10" value="${v.priority}" style="width:64px"></label>
      <label class="small"><input id="f-en" type="checkbox" ${v.enabled ? "checked" : ""}> Grabar</label>
      <label class="small"><input id="f-dual" type="checkbox" ${v.dual_recording ? "checked" : ""}> Grabar también la secundaria</label>
      <label class="small" title="Movimiento y analíticas que la cámara informa por ONVIF, como marcas en la línea de tiempo"><input id="f-ev" type="checkbox" ${v.events === "onvif" ? "checked" : ""}> Registrar eventos ONVIF</label>
    </div>
    <p class="muted small">Sin usuario ni contraseña en la URL: van en sus campos y se guardan en un archivo del servidor que solo puede leer el servicio, y nunca se vuelven a mostrar.${edit && v.has_credentials ? " Para quitar las credenciales escribí un espacio en Usuario." : ""}</p>
    <div class="row"><button class="b" id="f-test">Probar conexión</button><button class="b primary" id="f-save">${edit ? "Guardar" : "Crear y grabar"}</button><button class="b" id="f-cancel">Cancelar</button></div>
    <div id="f-res" class="small"></div></div>`;
  $("#f-tr").value = v.rtsp_transport; $("#f-audio").value = v.audio;
  if (seed) {
    if (seed.name) $("#f-name").value = seed.name;
    if (lastCreds.username) { $("#f-user").value = lastCreds.username; $("#f-pass").value = lastCreds.password; }
  }
  let xaddr = seed ? seed.xaddr : "", onvifURL = v.onvif_url || "";
  $("#f-host").oninput = () => { xaddr = ""; };
  $("#f-onvif").onclick = async () => {
    const r = $("#f-onvif-res"), host = $("#f-host").value.trim();
    if (!host && !xaddr) { r.innerHTML = `<span class="bad">Escribí la IP de la cámara</span>`; return; }
    r.textContent = "Leyendo la cámara por ONVIF…";
    const c = creds();
    try {
      const p = await api("/api/v1/cameras/probe", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(Object.assign(xaddr ? {xaddr} : {host, onvif_port: +$("#f-oport").value || 80}, edit ? {camera_id: v.id} : {}, c))});
      if (c.username) lastCreds = {username: c.username, password: c.password || ""};
      if (p.onvif_url) onvifURL = p.onvif_url;
      if (!edit && p.capabilities.some(x => x.capability === "onvif.events.properties" && x.status === "confirmed")) $("#f-ev").checked = true;
      if (p.suggested.main_url) $("#f-main").value = p.suggested.main_url;
      if (p.suggested.sub_url) $("#f-sub").value = p.suggested.sub_url;
      if (!$("#f-name").value.trim() || (seed && $("#f-name").value === seed.name)) $("#f-name").value = p.suggested.name;
      if (!edit && !$("#f-id").value.trim()) $("#f-id").value = slug(p.model ? p.model + "-" + host.split(".").pop() : "cam-" + host.replace(/\./g, "-"));
      const prof = p.profiles.map(x => `${esc(x.name || x.token)}: ${esc(x.encoding || "?")} ${x.width ? x.width + "×" + x.height : ""}${x.frame_rate ? " " + x.frame_rate + " fps" : ""}${x.stream_uri === p.main_url ? " <b>(principal)</b>" : x.stream_uri === p.sub_url ? " <b>(secundaria)</b>" : ""}`).join(" · ");
      r.innerHTML = `<div class="s-healthy">✓ ${esc([p.manufacturer, p.model].filter(Boolean).join(" ") || "Equipo ONVIF")}${p.firmware ? ` · firmware ${esc(p.firmware)}` : ""}${p.serial ? ` · serie ${esc(p.serial)}` : ""}</div>
        <div class="muted">Perfiles: ${prof || "ninguno"}${Math.abs(p.clock_offset_ms) > 60000 ? ` · <span class="warn">el reloj de la cámara difiere ${Math.round(p.clock_offset_ms / 60000)} min</span>` : ""}</div>
        ${p.analytics && p.analytics.length ? `<div class="muted">Analíticas anunciadas (sin probar): ${esc(p.analytics.join(", "))}</div>` : ""}
        ${p.main_url ? "" : `<div class="bad">La cámara no dio una URL RTSP: completala a mano.</div>`}
        ${p.camera_id ? `<div class="warn">Esta IP ya está cargada como ${esc(p.camera_id)}.</div>` : ""}
        <details><summary class="muted">Capacidades (${p.capabilities.length})</summary>${p.capabilities.map(x => `<div>${esc(x.capability)}: <b>${esc(CAPSTATE[x.status] || x.status)}</b> <span class="muted">${esc(x.evidence || "")}</span></div>`).join("")}</details>
        <div class="muted">Revisá los datos y tocá Probar conexión o ${edit ? "Guardar" : "Crear y grabar"}.</div>`;
    } catch (e) { r.innerHTML = `<span class="bad">✗ ${esc(ONVIFERR[e.code] || e.message)}</span>`; }
  };
  if (seed) $("#f-onvif").click();
  $("#f-cancel").onclick = () => { f.innerHTML = ""; };
  const creds = () => {
    const u = $("#f-user").value, p = $("#f-pass").value, o = {};
    if (u.trim() === "" && u.length) o.username = "";
    else if (u) o.username = u.trim();
    if (p) o.password = p;
    return o;
  };
  $("#f-test").onclick = async () => {
    const r = $("#f-res"); r.textContent = "Probando…";
    const urls = [["principal", $("#f-main").value.trim()], ["secundaria", $("#f-sub").value.trim()]].filter(x => x[1]);
    const out = [];
    for (const [label, url] of urls) {
      try {
        const p = await api("/api/v1/cameras/test", {method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify(Object.assign({url, rtsp_transport: $("#f-tr").value}, edit ? {camera_id: v.id} : {}, creds()))});
        out.push(p.ok ? `<div class="s-healthy">✓ ${label}: ${p.streams.map(s => esc(s.kind === "video" ? `${s.codec} ${s.width}×${s.height}${s.fps ? " " + s.fps + " fps" : ""}` : `${s.kind} ${s.codec}${s.sample_rate ? " " + s.sample_rate + " Hz" : ""}`)).join(" · ")}</div>`
          : `<div class="bad">✗ ${label}: ${esc(PROBE[p.error] || p.message || p.error)}</div>`);
      } catch (e) { out.push(`<div class="bad">✗ ${label}: ${esc(e.message)}</div>`); }
    }
    r.innerHTML = out.join("") || `<span class="bad">Falta la URL principal</span>`;
  };
  $("#f-save").onclick = async () => {
    const r = $("#f-res");
    const body = Object.assign({name: $("#f-name").value, main_url: $("#f-main").value.trim(), sub_url: $("#f-sub").value.trim(),
      onvif_url: onvifURL, events: $("#f-ev").checked ? "onvif" : "",
      rtsp_transport: $("#f-tr").value, audio: $("#f-audio").value, priority: +$("#f-prio").value,
      enabled: $("#f-en").checked, dual_recording: $("#f-dual").checked}, creds());
    if (!edit) body.id = $("#f-id").value.trim();
    try {
      await api(edit ? `/api/v1/cameras/${encodeURIComponent(v.id)}` : "/api/v1/cameras", {method: edit ? "PUT" : "POST",
        headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
      f.innerHTML = ""; cams();
    } catch (e) { r.innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
  };
}
const EVTYPE = {motion: "movimiento", person: "persona", vehicle: "vehículo", lpr: "patente", face: "rostro", line_crossing: "cruce de línea", intrusion: "intrusión", tamper: "sabotaje", onvif: "evento ONVIF"};
const PROBE = {auth_failed: "usuario o contraseña rechazados", not_found: "la cámara no tiene esa ruta de stream", unreachable: "no se puede conectar (IP o puerto)", timeout: "la cámara no respondió a tiempo", no_video: "el stream no tiene video"};

async function storage() {
  const [sum, v] = await Promise.all([api("/api/v1/storage"), api("/api/v1/storage/volumes")]);
  $("#main").innerHTML = `
  <div class="note"><b>Varios discos no son redundancia.</b> Si un disco independiente falla, se pierden sus grabaciones. Para tolerancia a fallas use RAID, Storage Spaces o ZFS por debajo del Recorder.</div>
  <div class="card"><h2>Volúmenes · colocación <code>${esc(sum.placement)}</code> · presión <code>${esc(sum.pressure_policy)}</code></h2>
  <table><tr><th>Volumen</th><th>Estado</th><th>Ocupación del Recorder</th><th>Capacidad</th><th>Límite efectivo</th><th>Cuota</th><th>Avisos</th><th></th></tr>
  ${v.items.map(x => {
    const cap = x.capacity_bytes || 1, pct = b => (100 * b / cap).toFixed(2);
    return `<tr>
    <td><b>${esc(x.id)}</b><div class="muted small">${esc(x.root_path)}</div><div class="muted small">${esc(x.fs_type)} · ${esc(x.stable_id)}</div></td>
    <td>${pill(x.state)}${x.state_reason ? `<div class="small muted">${esc(x.state_reason)}</div>` : ""}</td>
    <td><div class="bar" title="azul: grabaciones; amarillo: inicio de limpieza; rojo: límite efectivo">
      <i style="width:${pct(x.recorder_bytes)}%"></i>
      <b style="left:${pct(x.limits.cleanup_start_bytes)}%;background:var(--warn)"></b>
      <b style="left:${pct(x.limits.effective_bytes)}%;background:var(--bad)"></b></div>
      <div class="small muted">${fmtGB(x.recorder_bytes)} · libre ${fmtGB(x.free_bytes)}</div></td>
    <td>${fmtGB(x.capacity_bytes)}</td>
    <td>${fmtGB(x.limits.effective_bytes)}<div class="small muted">por ${esc(x.limits.binding_constraint)}</div></td>
    <td>${x.quota.max_percent}%<div class="small muted">reserva ${fmtGB(x.quota.min_free_bytes)}</div></td>
    <td class="small">${x.warnings.map(w => `<div class="${w === "no_redundancy_assumed" ? "muted" : "warn"}">${esc(WARN[w] || w)}</div>`).join("")}</td>
    <td>${x.state === "uninitialized" ? `<button class="b" data-init="${esc(x.id)}">Inicializar</button>` : ""}</td></tr>`;
  }).join("")}</table>
  <p class="muted small">Inicializar solo funciona sobre una carpeta vacía: escribe un marcador y prueba escritura. Nunca se formatea ni repara un disco.</p></div>`;
  document.querySelectorAll("[data-init]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api(`/api/v1/storage/volumes/${encodeURIComponent(b.dataset.init)}/validate`, {method: "POST"}); storage(); }
    catch (e) { alert(e.message); b.disabled = false; }
  });
}

const toLocalInput = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
async function rec() {
  const c = await api("/api/v1/cameras");
  if (!c.items.length) { $("#main").innerHTML = `<div class="card muted">No hay cámaras configuradas.</div>`; return; }
  const now = new Date(), from = new Date(now - 24 * 3600e3);
  $("#main").innerHTML = `<div class="card">
    <div class="row">
      <select id="cam">${c.items.map(x => `<option value="${esc(x.id)}">${esc(x.name || x.id)}</option>`).join("")}</select>
      <label class="small muted">desde</label><input type="datetime-local" id="from" value="${toLocalInput(from)}">
      <label class="small muted">hasta</label><input type="datetime-local" id="to" value="${toLocalInput(now)}">
      <button class="b" id="load">Ver</button>
    </div>
    <div class="legend small muted"><span><i style="background:var(--rec)"></i>grabado</span><span><i style="background:var(--na)"></i>en volumen no disponible</span><span><i style="background:var(--gap)"></i>hueco registrado</span><span><i style="background:var(--warn)"></i>evento</span><span>Clic en la barra para reproducir desde ese momento.</span></div>
    <svg class="tl" id="tl"></svg><div class="row small muted" id="tlx"></div>
    <div id="evl" class="small"></div>
  </div>
  <div class="card"><h2>Reproducción</h2><video id="vid" controls playsinline></video><p class="small muted" id="pinfo">Elegí un momento en la línea de tiempo.</p></div>
  <div class="card"><h2>Exportar evidencia</h2>
    <div class="row"><label class="small muted">desde</label><input type="datetime-local" id="ef"><label class="small muted">hasta</label><input type="datetime-local" id="et"><button class="b primary" id="exp">Exportar MP4</button></div>
    <p class="small muted">Se remuxa sin recodificar. El inicio se ajusta al keyframe anterior. El ZIP incluye manifest.json con SHA-256 del video y de cada segmento de origen verificado.</p>
    <div id="estat" class="small"></div></div>`;
  $("#load").onclick = loadTL; $("#exp").onclick = doExport;
  await loadTL();
}

let tlRange;
async function loadTL() {
  const cam = $("#cam").value, f = new Date($("#from").value), t = new Date($("#to").value);
  tlRange = {cam, f, t};
  const q = `from=${f.toISOString()}&to=${t.toISOString()}`;
  const [d, ev] = await Promise.all([api(`/api/v1/cameras/${encodeURIComponent(cam)}/recordings?${q}`),
    api(`/api/v1/cameras/${encodeURIComponent(cam)}/events?${q}&limit=500`).catch(() => ({items: []}))]);
  const W = 1000, span = t - f, x = v => Math.max(0, Math.min(W, (new Date(v) - f) / span * W));
  const parts = [`<rect x="0" y="8" width="${W}" height="32" fill="var(--bg)" stroke="var(--line)"/>`];
  for (const i of d.intervals) parts.push(`<rect x="${x(i.start)}" y="8" width="${Math.max(1, x(i.end) - x(i.start))}" height="32" fill="${i.available ? "var(--rec)" : "var(--na)"}"><title>${esc(fmtT(i.start))} → ${esc(fmtT(i.end))} · ${i.segments} segmentos · ${esc(i.volume_ids.join(", "))}</title></rect>`);
  for (const g of d.gaps) parts.push(`<rect x="${x(g.start)}" y="40" width="${Math.max(2, x(g.end || t) - x(g.start))}" height="6" fill="var(--gap)"><title>hueco: ${esc(g.reason)} ${esc(fmtT(g.start))}</title></rect>`);
  for (const e of ev.items) parts.push(`<rect x="${x(e.timestamp_utc)}" y="2" width="2" height="6" fill="var(--warn)"><title>${esc(EVTYPE[e.type] || e.type)}${e.class ? " " + esc(e.class) : ""} · ${esc(fmtT(e.timestamp_utc))}</title></rect>`);
  $("#evl").innerHTML = ev.items.length ? `<details><summary class="muted">Eventos de la cámara (${ev.items.length}${ev.next_cursor ? "+" : ""})</summary><table><tr><th>Hora</th><th>Evento</th><th>Detalle</th><th></th></tr>${ev.items.slice(0, 200).map((e, i) => `<tr><td>${esc(fmtT(e.timestamp_utc))}</td><td>${esc(EVTYPE[e.type] || e.type)}</td><td class="muted">${esc(e.class || (e.raw && e.raw.topic) || "")}</td><td><button class="b" data-ev="${i}">Ver</button></td></tr>`).join("")}</table></details>` : "";
  $("#evl").querySelectorAll("[data-ev]").forEach(b => b.onclick = () => play(new Date(new Date(ev.items[+b.dataset.ev].timestamp_utc).getTime() - 5e3)));
  const svg = $("#tl"); svg.setAttribute("viewBox", `0 0 ${W} 56`); svg.setAttribute("preserveAspectRatio", "none"); svg.innerHTML = parts.join("");
  $("#tlx").textContent = `${fmtT(f)} — ${fmtT(t)} · ${d.intervals.length} intervalos · ${d.gaps.length} huecos`;
  svg.onclick = ev => { const r = svg.getBoundingClientRect(); play(new Date(f.getTime() + (ev.clientX - r.left) / r.width * span)); };
  $("#ef").value = toLocalInput(new Date(t - 10 * 60e3)); $("#et").value = toLocalInput(t);
}

async function play(at) {
  const from = new Date(at.getTime() - 5e3), to = new Date(at.getTime() + 30 * 60e3);
  const p = await api(`/api/v1/cameras/${encodeURIComponent(tlRange.cam)}/playback?from=${from.toISOString()}&to=${to.toISOString()}`, {method: "POST"});
  const url = location.origin + p.url, v = $("#vid");
  if (v.canPlayType("application/vnd.apple.mpegurl")) {
    v.src = url; v.play().catch(() => {});
    $("#pinfo").textContent = `Desde ${fmtT(from)} · enlace válido hasta ${fmtT(p.expires_at)}`;
  } else {
    v.removeAttribute("src");
    $("#pinfo").innerHTML = `Este navegador no reproduce HLS de forma nativa. Abrí este enlace en VLC (válido hasta ${esc(fmtT(p.expires_at))}):<br><code>${esc(url)}</code>`;
  }
}

async function doExport() {
  const st = $("#estat");
  const body = {camera_id: $("#cam").value, from: new Date($("#ef").value).toISOString(), to: new Date($("#et").value).toISOString()};
  try {
    let e = await api("/api/v1/exports", {method: "POST", headers: {"Content-Type": "application/json", "Idempotency-Key": Date.now().toString(36) + Math.random().toString(36).slice(2)}, body: JSON.stringify(body)});
    while (e.state === "queued" || e.state === "running") {
      st.textContent = `Exportando… ${Math.round(e.progress * 100)}%`;
      await new Promise(r => setTimeout(r, 1000));
      e = await api(`/api/v1/exports/${e.id}`);
    }
    if (e.state !== "succeeded") { st.innerHTML = `<span class="bad">${esc(e.error || e.state)}</span>`; return; }
    const r = await api(`/api/v1/exports/${e.id}/download`, {raw: true});
    const a = document.createElement("a"); a.href = URL.createObjectURL(await r.blob()); a.download = e.id + ".zip"; a.textContent = "Descargar " + e.id + ".zip";
    st.innerHTML = `Listo: ${esc(fmtT(e.actual_from))} → ${esc(fmtT(e.actual_to))} · ${fmtGB(e.size_bytes)} · SHA-256 <code>${esc(e.sha256)}</code><br>`;
    st.appendChild(a);
  } catch (err) { st.innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
}

show("dash");
</script>
</body>

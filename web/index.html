      try {
        const created = await api("/api/v1/exports", {
          method: "POST",
          headers: {"Content-Type": "application/json", "Idempotency-Key": Date.now().toString(36) + Math.random().toString(36).slice(2)},
          body: JSON.stringify({
            camera_id: camId,
            from: new Date(fromMs).toISOString(),
            to: new Date(toMs).toISOString(),
            name: name || undefined
          })
        });
        activeRecExport = created;
        renderActiveRecExportStatus();
        if (created.state === "queued" || created.state === "running") {
          recExpPollTimer = setTimeout(() => pollActiveRecExport(created.id), 700);
        }
      } catch (err) {
        if (msgEl) msgEl.innerHTML = `<span class="bad">✗ ${esc(err.message)}</span>`;
      } finally {
        recExportBusy = false;
        updateExportMarkerControls();
      }
    };

    const openExportNamePopup = () => {
      if (recMarkStartMs === null || recMarkEndMs === null || recMarkEndMs <= recMarkStartMs || recExportBusy) return;
      $("#rec-exp-modal")?.remove();
      const curCamId = $("#rec-exp-cam")?.value || dashCamsCache[0]?.id || "";
      const startSnap = recMarkStartMs, endSnap = recMarkEndMs;
      const durText = fmtSelDuration(endSnap - startSnap);
      const ov = document.createElement("div");
      ov.id = "rec-exp-modal";
      ov.style.cssText = "position:fixed;inset:0;background:rgba(4,7,12,.78);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px";
      ov.innerHTML = `<form id="rec-pop-form" style="width:min(440px,94vw);background:var(--s1);border:1px solid var(--line2);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:11px 15px;background:var(--s2);border-bottom:1px solid var(--line)">
          <b>✂ Exportar selección</b>
          <span class="rec-sel-pill" style="padding:2px 8px">Duración: <b class="num">${esc(durText)}</b></span>
        </div>
        <div style="padding:14px 15px;display:flex;flex-direction:column;gap:10px">
          <div class="small muted num" style="background:var(--s2);border:1px solid var(--line);border-radius:6px;padding:7px 10px">
            Inicio: <b style="color:#22c55e">${esc(fmtT(startSnap))}</b><br>
            Fin: <b style="color:#ef4444">${esc(fmtT(endSnap))}</b>
          </div>
          <label class="small muted">Cámara
            <select id="rec-pop-cam" style="width:100%;margin-top:4px">${dashCamsCache.map(c => `<option value="${esc(c.id)}" ${c.id === curCamId ? "selected" : ""}>${esc(c.name || c.id)}</option>`).join("")}</select>
          </label>
          <label class="small muted">Nombre del clip
            <input id="rec-pop-name" placeholder="Ej. Acceso portón (opcional)" style="width:100%;margin-top:4px" maxlength="120" autocomplete="off">
          </label>
        </div>
        <div class="row" style="padding:10px 15px;background:var(--s2);border-top:1px solid var(--line);justify-content:flex-end;margin:0;gap:8px">
          <button type="button" class="b sm" id="rec-pop-cancel">Cancelar</button>
          <button type="submit" class="b sm mark-start" id="rec-pop-go">✂ Confirmar y exportar</button>
        </div>
      </form>`;
      document.body.appendChild(ov);
      const closePop = () => { ov.remove(); document.removeEventListener("keydown", onEsc); };
      const onEsc = e => { if (e.key === "Escape") closePop(); };
      document.addEventListener("keydown", onEsc);
      ov.onclick = e => { if (e.target === ov) closePop(); };
      ov.querySelector("#rec-pop-cancel").onclick = closePop;
      const inp = ov.querySelector("#rec-pop-name");
      inp?.focus();
      ov.querySelector("#rec-pop-form").onsubmit = ev => {
        ev.preventDefault();
        const chosenCam = ov.querySelector("#rec-pop-cam").value;
        const chosenName = inp.value.trim();
        if ($("#rec-exp-cam")) $("#rec-exp-cam").value = chosenCam;
        closePop();
        startMarkedExport(chosenCam, startSnap, endSnap, chosenName);
      };
    };

    $("#rec-exp-go").onclick = openExportNamePopup;
    renderActiveRecExportStatus();
    updateExportMarkerControls();

    await loadAndRenderRecordedTimeline();
    await seekRecordedGrid(recPlayheadMs);
    startRecordedClock();
  }
}

  const [sum, cams, ev] = await Promise.all([
    api("/api/v1/storage"),

  dashCamsCache = cams.items || [];
  dashEventsCache = ev.items || [];
  const alertsEl = $("#dash-alerts");
  if (alertsEl) alertsEl.innerHTML = renderAlertsHTML(sum.alerts);

  const count = gridCfg().count;
  const now = Date.now();
  for (let i = 0; i < count; i++) {
    const camId = layoutSlots[i];
    if (!camId) continue;
    const c = dashCamsCache.find(x => x.id === camId);
    if (!c) continue;
    const mainSt = c.streams.find(s => s.representation === "main") || c.streams[0];
    const st = mainSt?.state || (c.enabled ? "stopped" : "disabled");
    const ledColor = st === "recording" ? "var(--ok)" : (st === "backoff" || st === "starting" ? "var(--warn)" : "var(--bad)");
    const led = document.querySelector(`[data-slot-led="${i}"]`);
    if (led) led.style.color = ledColor;
    const recEl = document.querySelector(`[data-slot-rec="${i}"]`);
    if (recEl) {
      const recInfo = camRecordingInfo(c, lastCaps);
      recEl.className = "rec-ico" + (recInfo.anyRec ? " rec" : "");
      recEl.title = recInfo.title;
      recEl.innerHTML = `<i class="rec-dot"></i><span>${recInfo.text}</span>${recInfo.modeSvg}`;
    }
    const boxEl = document.querySelector(`[data-slot-boxes="${i}"]`);
    const detEl = document.querySelector(`[data-slot-det="${i}"]`);
    const tileEl = document.querySelector(`[data-slot="${i}"]`);
    if (boxEl) {
      const detRes = renderCamDetBoxesHTML(camId, dashEventsCache, now, 9500);
      boxEl.innerHTML = detRes.boxesHTML;
      if (detEl) detEl.innerHTML = detRes.pillHTML;
      tileEl?.classList.toggle("has-det", detRes.hot);
    }
  }
  refreshSidebarUI();
}

function setLiveBadge(slotIdx, text, cls) {
  const el = document.querySelector(`[data-live-badge="${slotIdx}"]`);
  if (!el) return;

  el.className = "tile-badge" + (cls ? " " + cls : "");
}

function scheduleRTCRetry(slotIdx, camId, delayMs = 4000, rep = "") {
  const k = String(slotIdx);
  if (view !== "dash" || wallMode !== "live" || authRequired) return;
  if (rtcRetryTimers.has(k)) clearTimeout(rtcRetryTimers.get(k));
  rtcRetryTimers.set(k, setTimeout(() => {
    rtcRetryTimers.delete(k);
    if (view === "dash" && wallMode === "live" && layoutSlots[slotIdx] === camId) {
      const c = dashCamsCache.find(x => x.id === camId);
      startSlotWebRTC(slotIdx, camId, rep || (c ? preferredTileStream(c, slotIdx) : ""));
    }
  }, delayMs));
}

async function startSlotWebRTC(slotIdx, camId, requestedRep = "") {
  if (view !== "dash" || wallMode !== "live") return;
  const k = String(slotIdx);
  let state = rtcSlotState.get(k);
  if (!state) {
    state = {front: "a", pc: null, pendingPC: null, gen: 0};
    rtcSlotState.set(k, state);
  }
  if (rtcRetryTimers.has(k)) { clearTimeout(rtcRetryTimers.get(k)); rtcRetryTimers.delete(k); }
  if (state.pendingPC) { try { state.pendingPC.close(); } catch {} state.pendingPC = null; }

  const gen = ++state.gen;
  const hasActiveFront = !!(state.pc && activeSlotVid(slotIdx)?.classList.contains("ready"));
  const targetLayer = hasActiveFront ? (state.front === "a" ? "b" : "a") : state.front;
  const vid = document.querySelector(`video[data-slot-v${targetLayer}="${slotIdx}"]`);
  if (!vid) return;
  if (typeof RTCPeerConnection === "undefined") {
    setLiveBadge(slotIdx, "N/A", "");
    return;
  }

  // Double-buffered swap: keep existing SD/HD stream smoothly visible until the new one renders its first frame!
  if (!hasActiveFront) setLiveBadge(slotIdx, "…", "warn");
  const pc = new RTCPeerConnection();
  state.pendingPC = pc;
  pc.addTransceiver("video", {direction: "recvonly"});
  pc.addTransceiver("audio", {direction: "recvonly"});
  const stream = new MediaStream();
  vid.muted = true; // always stays muted during standby handoff

  pc.ontrack = ev => {
    if (view !== "dash" || wallMode !== "live" || state.gen !== gen) return;
    stream.addTrack(ev.track);
    if (vid.srcObject !== stream) vid.srcObject = stream;
    if (ev.track.kind === "video") {
      vid.onplaying = () => {
        if (view !== "dash" || wallMode !== "live" || state.gen !== gen) return;
        const oldPC = state.pc;
        const oldLayer = state.front;
        const oldVid = document.querySelector(`video[data-slot-v${oldLayer}="${slotIdx}"]`);
        state.front = targetLayer;
        state.pc = pc;
        if (state.pendingPC === pc) state.pendingPC = null;

        vid.classList.add("ready", "is-front");
        vid.closest(".tile-stage")?.classList.add("playing");
        applySlotAudio(slotIdx, camId);
        setLiveBadge(slotIdx, "● LIVE", "is-live");

        if (oldVid && oldVid !== vid) {
          oldVid.muted = true;
          oldVid.classList.remove("ready", "is-front");
          oldVid.srcObject = null;
        }
        if (oldPC && oldPC !== pc) { try { oldPC.close(); } catch {} }
      };
      vid.play().catch(() => {});
    }
  };
  pc.onconnectionstatechange = () => {
    if (view !== "dash" || wallMode !== "live") return;
    const isCurrent = state.pc === pc || state.pendingPC === pc;
    if (!isCurrent) return;
    if (pc.connectionState === "failed" || pc.connectionState === "disconnected" || pc.connectionState === "closed") {
      if (state.pendingPC === pc && state.pc && state.pc !== pc) {
        // Standby upgrade failed; keep foreground stream alive and retry upgrade cleanly.
        try { pc.close(); } catch {}
        state.pendingPC = null;
        scheduleRTCRetry(slotIdx, camId, 3000, requestedRep);
        return;
      }
      vid.classList.remove("ready", "is-front");
      vid.closest(".tile-stage")?.classList.remove("playing");
      setLiveBadge(slotIdx, "…", "warn");
      scheduleRTCRetry(slotIdx, camId, 3500, requestedRep);
    }
  };

  try {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    const payload = requestedRep ? {sdp: offer.sdp, stream: requestedRep} : {sdp: offer.sdp};
    const ans = await api(`/api/v1/cameras/${encodeURIComponent(camId)}/webrtc`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });
    if (view !== "dash" || wallMode !== "live" || state.gen !== gen) { try { pc.close(); } catch {} return; }
    if (ans.stream) setLiveStreamBadge(slotIdx, ans.stream);
    await pc.setRemoteDescription({type: "answer", sdp: ans.sdp});
  } catch (e) {
    if (state.gen === gen) {
      try { pc.close(); } catch {}
      if (state.pendingPC === pc) state.pendingPC = null;
      if (!state.pc) setLiveBadge(slotIdx, "RETRY", "warn");
      scheduleRTCRetry(slotIdx, camId, 5000, requestedRep);
    }
  }
}

const thumbs = {};
let pendingCam = null;
const thumbAge = at => { const s = Math.max(0, Math.round((Date.now() - at) / 1000)); return s < 90 ? `hace ${s}s` : `hace ${Math.round(s / 60)}m`; };
async function refreshThumb(id) {
  const lt = document.querySelector(`[data-lt="${CSS.escape(id)}"]`);
  try {
    const r = await api(`/api/v1/cameras/${encodeURIComponent(id)}/snapshot`, {raw: true});
    const at = Date.parse(r.headers.get("X-Snapshot-Time")) || Date.now(), url = URL.createObjectURL(await r.blob());
    if (thumbs[id]) URL.revokeObjectURL(thumbs[id].url);
    thumbs[id] = {url, at};
    document.querySelectorAll(`img[data-poster="${CSS.escape(id)}"]`).forEach(img => { img.src = url; });
    if (lt) lt.textContent = thumbAge(at);
  } catch (e) {
    if (lt) lt.textContent = e.code === "no_recording" ? "sin grabación" : "sin imagen";
  }
}

async function storage() {

    let rem = quota - s1;

    rem -= s2;
    if (rem <= s3) return {days: p.full_days + p.half_fps_days + rem / (0.05 * bpd), req};

    const body = {full_days: +$("#r-full").value, half_fps_days: +$("#r-half").value, events_only_days: +$("#r-ev").value};
    try {
      await api("/api/v1/storage/retention", {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
      $("#r-msg").innerHTML = `<span class="s-healthy" style="padding:4px 8px;border-radius:4px">✓ Política guardada (${body.full_days} + ${body.half_fps_days} + ${body.events_only_days} días).</span>`;
    } catch (e) { $("#r-msg").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
  };

  $("#vadd").onclick = () => volForm();
  document.querySelectorAll("[data-vedit]").forEach(b => b.onclick = () => volForm(v.items.find(x => x.id === b.dataset.vedit)));
  document.querySelectorAll("[data-vdel]").forEach(b => b.onclick = async () => {
    if (!confirm(`¿Quitar el disco ${b.dataset.vdel} de la lista? Los archivos no se borran.`)) return;
    try { await api(`/api/v1/storage/volumes/${encodeURIComponent(b.dataset.vdel)}`, {method: "DELETE", raw: true}); storage(); }
    catch (e) { alert(VOLERR[e.code] || e.message); }
  });
  document.querySelectorAll("[data-init]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api(`/api/v1/storage/volumes/${encodeURIComponent(b.dataset.init)}/validate`, {method: "POST"}); storage(); }
    catch (e) { alert(e.message); b.disabled = false; }
  });
  document.querySelectorAll("[data-vdrain]").forEach(b => b.onclick = async () => {
    const id = b.dataset.vdrain;
    const migrate = confirm(`¿Pasar el volumen "${id}" a estado draining?\n\nAceptar: drenar Y migrar segmentos verificando SHA-256 hacia otros discos sanos.\nCancelar: solo consultar / cancelar acción.`);
    if (!migrate) return;
    b.disabled = true;
    try {
      await api(`/api/v1/storage/volumes/${encodeURIComponent(id)}/drain`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({migrate_segments: true})});
      storage();
    } catch (e) { alert(e.message); b.disabled = false; }
  });
  $("#sp-save").onclick = async () => {
    const body = {
      placement: $("#sp-place").value,
      pressure_policy: $("#sp-press").value,
      default_max_percent: +$("#sp-max").value,
      cleanup_start_percent: +$("#sp-start").value,
      cleanup_target_percent: +$("#sp-target").value,
      min_free_bytes: Math.round(+$("#sp-minfree").value * GB)
    };
    try {
      await api("/api/v1/storage/policies/default", {method: "PATCH", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
      storage();
    } catch (e) { $("#sp-msg").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
  };
}

const VOLERR = {volume_not_empty: "La carpeta ya tiene archivos que no son del Recorder: elegí una carpeta vacía o nueva.", volume_exists: "Ya hay un disco con ese identificador.", volume_has_recordings: "El disco todavía tiene grabaciones indexadas: deshabilitalo en lugar de quitarlo."};
function volForm(vol) {
  const edit = !!vol, v = vol || {enabled: true, priority: 0, weight: 1, quota: {max_percent: 90, min_free_bytes: 20 * GB, quota_bytes: 0}};
  const f = $("#form");
  f.innerHTML = `<div class="sub-card">
    <div class="card-head"><h2>${edit ? "Editar disco · " + esc(v.id) : "Agregar volumen de almacenamiento"}</h2><button class="b sm" id="v-cancel">Cerrar</button></div>
    <div class="grid">
      <label class="small">Identificador<br><input id="v-id" value="${esc(v.id || "")}" ${edit ? "disabled" : ""} placeholder="disco-d" pattern="[a-z0-9][a-z0-9-]*" style="width:100%;margin-top:3px"></label>
      <label class="small">Carpeta (ruta absoluta)<br><input id="v-path" value="${esc(v.root_path || "")}" ${edit ? "disabled" : ""} placeholder="D:\\Grabaciones o /srv/grabaciones" style="width:100%;margin-top:3px"></label>
    </div>
    <div class="row" style="margin-top:10px">
      <label class="small">Cuota fija <input id="v-quota" type="number" min="0" step="1" value="${Math.round((v.quota.quota_bytes || 0) / GB)}" style="width:80px"> GB <span class="muted">(0 = auto)</span></label>
      <label class="small">Uso máximo <input id="v-max" type="number" min="1" max="100" step="1" value="${v.quota.max_percent}" style="width:64px"> %</label>
      <label class="small">Reserva libre <input id="v-free" type="number" min="0" step="1" value="${Math.round(v.quota.min_free_bytes / GB)}" style="width:72px"> GB</label>
      <label class="small">Prioridad <input id="v-prio" type="number" min="0" value="${v.priority}" style="width:64px"></label>
      <label class="small">Peso <input id="v-weight" type="number" min="1" value="${v.weight || 1}" style="width:64px"></label>
      <label class="small">Cámaras asignadas <input id="v-cams" value="${esc((v.cameras || []).join(", "))}" placeholder="cam1, cam2 (vacío = todas)" style="width:210px"></label>
      <label class="small"><input id="v-en" type="checkbox" ${v.enabled ? "checked" : ""}> Grabar en este disco</label>
      ${edit ? `<label class="small"><input id="v-dr" type="checkbox" ${v.state === "draining" ? "checked" : ""}> En drenaje (draining)</label>` : ""}
      ${edit && v.state !== "uninitialized" ? "" : `<label class="small"><input id="v-init" type="checkbox" checked> Crear carpeta e inicializar</label>`}
    </div>
    <p class="muted small" style="margin:4px 0 10px">Inicializar crea la carpeta si no existe y escribe un marcador; si ya contiene archivos ajenos al Recorder se rechaza. Nunca se formatea. ${edit ? "La ruta no se puede cambiar: agregá otro volumen." : ""}</p>
    <div class="row"><button class="b primary" id="v-save">${edit ? "Guardar cambios" : "Agregar volumen"}</button></div>
    <div id="v-res" class="small"></div></div>`;
  $("#v-cancel").onclick = () => { f.innerHTML = ""; };
  $("#v-save").onclick = async () => {
    const camList = $("#v-cams").value.split(",").map(s => s.trim()).filter(Boolean);
    const body = {quota_bytes: Math.round(+$("#v-quota").value * GB), max_percent: +$("#v-max").value, min_free_bytes: Math.round(+$("#v-free").value * GB), priority: +$("#v-prio").value,
      weight: +$("#v-weight").value, cameras: camList, enabled: $("#v-en").checked, initialize: !!$("#v-init")?.checked};
    if (edit) body.draining = !!$("#v-dr")?.checked;
    if (!edit) { body.id = $("#v-id").value.trim(); body.root_path = $("#v-path").value.trim(); }
    $("#v-save").disabled = true;
    try {
      await api(edit ? `/api/v1/storage/volumes/${encodeURIComponent(v.id)}` : "/api/v1/storage/volumes", {method: edit ? "PATCH" : "POST",
        headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
      f.innerHTML = ""; storage();
    } catch (e) { $("#v-res").innerHTML = `<span class="bad">${esc(VOLERR[e.code] || e.message)}</span>`; $("#v-save").disabled = false; }
  };
}

const MB = 1048576, fmtMB = b => b >= 1024 * MB ? (b / 1073741824).toFixed(1) + " GB" : Math.round(b / MB) + " MB";
const fmtUp = s => { const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d} d ${h} h` : h ? `${h} h ${m} min` : `${m} min`; };
const pct = v => (v ?? 0).toFixed(1) + " %";
async function sys() {
  const [r, v, ul, coreSt] = await Promise.all([
    api("/api/v1/system/resources"),
    api("/api/v1/storage/volumes"),
    api("/api/v1/users").catch(() => ({users: []})),
    api("/api/v1/core/status").catch(() => ({enabled: false, status: "disabled", sync_interval_seconds: 30, push_events: true, push_health: true}))
  ]);
  const memPct = r.host.mem_total_bytes ? 100 * r.host.mem_used_bytes / r.host.mem_total_bytes : 0;

  cfgRoot().innerHTML = `
  <div class="card">
    <div class="card-head"><h2>Telemetría de sistema <span class="sub">· v${esc(r.version)} · ${esc(r.os)}/${esc(r.arch)} · activo ${fmtUp(r.uptime_seconds)}</span></h2></div>
    <div class="grid">
      <div class="stat"><div class="v">${pct(r.recorder.cpu_percent)}</div><div class="k">CPU Recorder (100% = 1 núcleo)</div></div>
      <div class="stat"><div class="v">${fmtMB(r.recorder.rss_bytes)}</div><div class="k">RAM Recorder · ${r.goroutines} goroutines</div></div>
      <div class="stat"><div class="v">${pct(r.ffmpeg_total.cpu_percent)}</div><div class="k">CPU FFmpeg · ${r.streams.filter(s => s.ffmpeg).length} procesos</div></div>
      <div class="stat"><div class="v">${fmtMB(r.ffmpeg_total.rss_bytes)}</div><div class="k">RAM FFmpeg</div></div>
      <div class="stat"><div class="v">${pct(r.host.cpu_percent)}</div><div class="k">CPU Equipo (${r.host.cpus} núcleos)</div><div class="meter"><i style="width:${hostCpu.toFixed(1)}%"></i></div></div>
      <div class="stat"><div class="v">${pct(memPct)}</div><div class="k">RAM Equipo · ${fmtMB(r.host.mem_used_bytes)} / ${fmtMB(r.host.mem_total_bytes)}</div><div class="meter"><i style="width:${memPct.toFixed(1)}%"></i></div></div>
    </div>
  </div>
  <div class="card">
    <div class="card-head"><h2>Control de acceso y usuarios (RBAC)</h2></div>
    <div class="tbl-wrap"><table><thead><tr><th>Usuario</th><th>Rol</th><th>Creado</th><th>Acciones</th></tr></thead><tbody>
    ${(ul.users || []).map(u => `<tr><td><b>${esc(u.username)}</b></td><td><span class="pill" style="color:var(--accent);background:var(--accent-bg)">${esc(u.role)}</span></td><td class="small num">${fmtT(u.created_at)}</td>
      <td><button class="b sm" data-upass="${esc(u.username)}">Cambiar clave</button> <button class="b sm danger" data-udel="${esc(u.username)}">Eliminar</button></td></tr>`).join("")}
    </tbody></table></div>
    <div class="row" style="margin-top:12px">
      <input id="nu-name" placeholder="Nuevo usuario" autocomplete="off">
      <input id="nu-pass" type="password" placeholder="Contraseña (mín. 4)" autocomplete="new-password">
      <select id="nu-role"><option value="admin">admin</option><option value="operator">operator</option><option value="viewer">viewer</option></select>
      <button class="b primary" id="nu-add">Crear usuario</button>
      <span id="nu-msg" class="small"></span>
    </div>
  </div>
  <div class="card">
    <div class="card-head">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <h2>Integración OpenVMS Core (Fase 4)</h2>
        ${pill(coreSt.status === "connected" ? "healthy" : coreSt.status === "disabled" ? "disabled" : "degraded")}
      </div>
      <div class="row" style="margin:0;gap:6px">
        <button class="b sm" id="core-man">Ver Manifiesto JSON</button>

        <button class="b primary sm" id="core-save">Guardar Core</button>
      </div>
    </div>
    <p class="muted small" style="margin:0 0 10px">Puente opcional de federación hacia OpenVMS Core (heartbeat firmados HMAC-SHA256 + envío por cursor de eventos + manifiesto pull en <code>/api/v1/core/manifest</code>). El grabador sigue 100% autónomo aunque Core esté desconectado.</p>
    <div class="grid">
      <label class="small">URL de OpenVMS Core<br><input id="core-url" value="${esc(coreSt.core_url || "")}" placeholder="https://openvms-core.ejemplo.local" style="width:100%;margin-top:3px"></label>
      <label class="small">Node ID<br><input id="core-node" value="${esc(coreSt.node_id || "")}" placeholder="openvms-recorder-1" style="width:100%;margin-top:3px"></label>
      <label class="small">Site ID<br><input id="core-site" value="${esc(coreSt.site_id || "")}" placeholder="sede-central" style="width:100%;margin-top:3px"></label>
      <label class="small">Token API Core ${coreSt.has_token ? "(configurado)" : ""}<br><input id="core-tok" type="password" placeholder="${coreSt.has_token ? "Dejar vacío para conservar" : "Token de enlace"}" autocomplete="new-password" style="width:100%;margin-top:3px"></label>

      <label class="small"><input id="core-pev" type="checkbox" ${coreSt.push_events !== false ? "checked" : ""}> Enviar eventos</label>
      <label class="small"><input id="core-phl" type="checkbox" ${coreSt.push_health !== false ? "checked" : ""}> Enviar salud/cámaras</label>

    <div class="muted small" style="margin-top:8px">

    </div>
    <div id="core-msg" class="small" style="margin-top:6px"></div>
    <pre id="core-pre" class="small" hidden style="margin-top:8px;max-height:220px;overflow:auto;background:var(--panel2);padding:8px;border-radius:6px"></pre>
  </div>
  <div class="split-dash">
    <div class="card" style="margin:0"><div class="card-head"><h2>Procesos de ingesta (FFmpeg)</h2></div>

        <td class="num">${s.bitrate_kbps ? (s.bitrate_kbps / 1000).toFixed(2) + " Mbps" : "—"}</td><td class="num">${s.segments}</td><td class="num">${s.reconnects}</td>
        <td class="num">${s.ffmpeg ? pct(s.ffmpeg.cpu_percent) : "—"}</td><td class="num">${s.ffmpeg ? fmtMB(s.ffmpeg.rss_bytes) : "—"}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted small">No hay streams activos.</p>`}
    </div>
    <div class="card" style="margin:0"><div class="card-head"><h2>Salud de volúmenes</h2></div>
      <div class="tbl-wrap"><table><thead><tr><th>Volumen</th><th>Estado</th><th>Grabado</th><th>Margen</th><th>Libre</th></tr></thead><tbody>
      ${v.items.map(x => `<tr><td><b>${esc(x.id)}</b><div class="muted small num">${esc(x.root_path)}</div></td><td>${pill(x.state)}</td>
        <td class="num">${fmtGB(x.recorder_bytes)}</td><td class="num">${fmtGB(x.limits.headroom_bytes ?? 0)}</td><td class="num">${fmtGB(x.free_bytes)}</td></tr>`).join("")}</tbody></table></div>
    </div>
  </div>
  <div class="card" style="margin-top:14px"><div class="card-head"><h2>Registro de diagnóstico del servicio</h2></div>
    ${r.recent_logs.length ? `<div class="tbl-wrap"><table><thead><tr><th>Fecha / Hora</th><th>Nivel</th><th>Mensaje</th></tr></thead><tbody>
    ${r.recent_logs.slice(0, 15).map(l => `<tr><td class="small num" style="white-space:nowrap">${fmtT(l.time)}</td><td><span class="pill ${l.level === "ERROR" ? "s-stopped" : "s-full"}">${esc(l.level)}</span></td>
      <td>${esc(l.message)}<div class="muted small num">${esc(Object.entries(l.attrs || {}).filter(([k]) => k !== "source").map(([k, val]) => k + "=" + val).join(" · "))}</div></td></tr>`).join("")}</tbody></table></div>` : `<p class="muted small">Sin avisos desde el arranque.</p>`}
  </div>`;
  $("#nu-add").onclick = async () => {
    const username = $("#nu-name").value.trim(), password = $("#nu-pass").value, role = $("#nu-role").value;
    try {
      await api("/api/v1/users", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({username, password, role})});

    if (!confirm(`¿Eliminar el usuario ${b.dataset.udel}?`)) return;

    catch (e) { alert(e.message); }
  });
  $("#core-save").onclick = async () => {
    const body = {
      enabled: $("#core-en").checked,
      core_url: $("#core-url").value.trim(),
      node_id: $("#core-node").value.trim(),
      site_id: $("#core-site").value.trim(),
      sync_interval_seconds: +$("#core-iv").value,
      push_events: $("#core-pev").checked,
      push_health: $("#core-phl").checked,
      tls_insecure_skip_verify: $("#core-tls").checked
    };
    const tok = $("#core-tok").value.trim();
    if (tok !== "") body.api_token = tok;
    try {
      await api("/api/v1/core/config", {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
      sys();
    } catch (e) { $("#core-msg").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
  };
  $("#core-sync").onclick = async () => {
    $("#core-msg").innerHTML = `<span class="muted">Sincronizando con OpenVMS Core…</span>`;

      sys();
    } catch (e) { $("#core-msg").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
  };
  $("#core-man").onclick = async () => {
    const pre = $("#core-pre");
    if (!pre.hidden) { pre.hidden = true; return; }
    try {
      const m = await api("/api/v1/core/manifest");
      pre.textContent = JSON.stringify(m, null, 2);
      pre.hidden = false;
    } catch (e) { $("#core-msg").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
  };
}

const toLocalInputSec = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 19);

const EXP_STATUS = {queued: "En cola", running: "Generando", succeeded: "Lista", failed: "Falló", cancelled: "Cancelada"};
const EXP_STATUS_CLS = {queued: "warn", running: "warn", succeeded: "s-healthy", failed: "bad", cancelled: "muted"};

function exportBaseFilename(x, camName) {
  const raw = (x?.request?.name || "").trim() || `${camName || x?.request?.camera_id || "clip"}-${x?.id || "export"}`;
  return raw.replace(/[^a-zA-Z0-9._-]+/g, "_").replace(/^_+|_+$/g, "") || x?.id || "export";
}

async function downloadExportFile(expObj, format, camName, btn) {
  const orig = btn?.innerHTML;
  if (btn) { btn.disabled = true; btn.textContent = "Descargando…"; }
  try {
    const ep = format === "zip" ? `/api/v1/exports/${encodeURIComponent(expObj.id)}/download` : `/api/v1/exports/${encodeURIComponent(expObj.id)}/video?download=1`;
    const r = await api(ep, {raw: true});
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement("a");
    a.href = url;
    a.download = exportBaseFilename(expObj, camName) + "." + format;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 15000);
  } catch (e) {
    alert("Error al descargar: " + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = orig; }
  }
}

async function openExportPlayerModal(expObj, camName) {
  $("#exp-modal")?.remove();
  const title = (expObj.request?.name || "").trim() || `${camName} · ${fmtT(expObj.actual_from || expObj.request?.from)}`;
  const ov = document.createElement("div");
  ov.id = "exp-modal";
  ov.style.cssText = "position:fixed;inset:0;background:rgba(4,7,12,.88);backdrop-filter:blur(5px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:99;padding:20px";
  ov.innerHTML = `<div style="width:min(960px,94vw);background:var(--s1);border:1px solid var(--line2);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--s2);border-bottom:1px solid var(--line)">
      <div><b>${esc(title)}</b> <span class="small muted">· ${esc(camName)} (${esc(expObj.request?.representation || "main")})</span></div>
      <div class="small muted num">${esc(fmtT(expObj.actual_from || expObj.request?.from))} → ${esc(fmtT(expObj.actual_to || expObj.request?.to))}</div>
    </div>
    <div style="position:relative;background:#020408">
      <video id="exp-player" controls autoplay playsinline style="width:100%;max-height:70vh;display:block;background:#000"></video>
      <div id="exp-player-msg" class="small muted" style="padding:10px 14px;border-top:1px solid var(--line);background:var(--s2)">Cargando MP4…</div>
    </div>
    <div class="row" style="padding:10px 14px;background:var(--s2);border-top:1px solid var(--line);justify-content:space-between;margin:0;gap:10px">
      <div class="small muted num" style="overflow:hidden;text-overflow:ellipsis">${expObj.size_bytes ? fmtMB(expObj.size_bytes) : ""}${expObj.sha256 ? ` · SHA-256 <code>${esc(expObj.sha256.slice(0, 16))}…</code>` : ""}</div>
      <div class="row" style="margin:0;gap:6px">
        <label class="small" style="display:inline-flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox" id="exp-compat"> Compat H.264</label>
        <button class="b sm" id="exp-dl-mp4">⬇ Descargar MP4</button>
        <button class="b sm primary" id="exp-dl-zip">⬇ Descargar ZIP (Evidencia)</button>
        <button class="b sm" id="exp-close">Cerrar</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(ov);

  let blobUrl = null;
  const closeModal = () => {
    const v = $("#exp-player");
    if (v) { v.pause(); v.removeAttribute("src"); }
    if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
    ov.remove();
    document.removeEventListener("keydown", onEsc);
  };
  const onEsc = e => { if (e.key === "Escape") closeModal(); };
  document.addEventListener("keydown", onEsc);
  ov.onclick = e => { if (e.target === ov || e.target.id === "exp-close") closeModal(); };
  ov.querySelector("#exp-dl-mp4").onclick = e => downloadExportFile(expObj, "mp4", camName, e.currentTarget);
  ov.querySelector("#exp-dl-zip").onclick = e => downloadExportFile(expObj, "zip", camName, e.currentTarget);

  const loadVideo = async (compat) => {
    const msg = ov.querySelector("#exp-player-msg");
    const vid = ov.querySelector("#exp-player");
    if (!vid || !msg) return;
    msg.textContent = compat ? "Transcodificando a H.264 compatible para el navegador…" : "Cargando video MP4…";
    try {
      const r = await api(`/api/v1/exports/${encodeURIComponent(expObj.id)}/video${compat ? "?compat=1" : ""}`, {raw: true});
      const nextUrl = URL.createObjectURL(await r.blob());
      if (!ov.isConnected) { URL.revokeObjectURL(nextUrl); return; }
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl = nextUrl;
      vid.onerror = () => {
        if (!compat) {
          ov.querySelector("#exp-compat").checked = true;
          loadVideo(true);
          return;
        }
        msg.innerHTML = `<span class="bad">El navegador no pudo decodificar este clip. Podés descargarlo con MP4 / ZIP.</span>`;
      };
      vid.onloadedmetadata = () => {
        msg.textContent = compat ? "Reproduciendo en modo compatible H.264 (el archivo original descargado no se modifica)." : "Reproduciendo MP4 original sin recodificar.";
      };
      vid.src = blobUrl;
      vid.play().catch(() => {});
    } catch (e) {
      msg.innerHTML = `<span class="bad">✗ ${esc(e.message)}</span>`;
    }
  };
  const compatToggle = ov.querySelector("#exp-compat");
  compatToggle.checked = false;
  compatToggle.onchange = () => loadVideo(compatToggle.checked);
  loadVideo(false);
}

let expFormOpen = false;
async function exportsView() {
  if (expTimer) { clearTimeout(expTimer); expTimer = null; }
  const [camsRes, expRes] = await Promise.all([
    api("/api/v1/cameras").catch(() => ({items: []})),
    api("/api/v1/exports?limit=150")
  ]);
  const cams = camsRes.items || [];
  const camNameById = Object.fromEntries(cams.map(c => [c.id, c.name || c.id]));
  const items = expRes.items || [];
  const hasActive = items.some(x => x.state === "queued" || x.state === "running");

  const now = new Date(), defFrom = new Date(now.getTime() - 5 * 60e3);
  $("#main").innerHTML = `<div class="card">
    <div class="card-head">
      <div>
        <h2>Exportaciones (${items.length})</h2>
        <div class="small muted" style="margin-top:2px">Clips pedidos desde Grabado o Eventos. Remux sin recodificar (MP4) + manifiesto verificable SHA-256.</div>
      </div>
      <div class="row" style="margin:0">
        <button class="b ${expFormOpen ? "primary" : ""}" id="exp-new-toggle">+ Nueva exportación</button>
        <button class="b" id="exp-ref">Actualizar</button>
      </div>
    </div>
    ${expFormOpen ? `<div class="sub-card">
      <div class="grid">
        <label class="small">Cámara<br><select id="exp-cam" style="width:100%;margin-top:3px">${cams.map(c => `<option value="${esc(c.id)}">${esc(c.name || c.id)}</option>`).join("")}</select></label>
        <label class="small">Desde<br><input type="datetime-local" step="1" id="exp-from" value="${toLocalInputSec(defFrom)}" style="width:100%;margin-top:3px"></label>
        <label class="small">Hasta<br><input type="datetime-local" step="1" id="exp-to" value="${toLocalInputSec(now)}" style="width:100%;margin-top:3px"></label>
        <label class="small">Nombre (opcional)<br><input id="exp-name" placeholder="Ej. Movimiento portón" style="width:100%;margin-top:3px"></label>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="b primary" id="exp-create">Generar exportación</button>
        <span id="exp-form-msg" class="small"></span>
      </div>
    </div>` : ""}
    ${!items.length ? `<p class="muted small" style="margin:8px 0">Todavía no hay exportaciones. Podés exportar clips desde <b>En vivo → Grabado</b>, desde <b>Eventos</b> o con <b>+ Nueva exportación</b>.</p>` : `
    <div class="tbl-wrap"><table><thead><tr><th>Nombre</th><th>Cámara</th><th>Rango</th><th>Creada</th><th>Estado</th><th style="text-align:right">Acciones</th></tr></thead><tbody>
    ${items.map(x => {
      const camId = x.request?.camera_id || "";
      const camName = camNameById[camId] || camId || "—";
      const dispName = (x.request?.name || "").trim() || `${camName} · ${x.id.slice(0, 10)}`;
      const fromT = x.actual_from || x.request?.from;
      const toT = x.actual_to || x.request?.to;
      const pctNum = Math.round((x.progress || 0) * 100);
      const stCls = EXP_STATUS_CLS[x.state] || "muted";
      return `<tr>
        <td><b>${esc(dispName)}</b><div class="small muted num">${esc(x.id)}${x.size_bytes ? " · " + fmtMB(x.size_bytes) : ""}</div></td>
        <td>${esc(camName)}<div class="small muted">${esc(x.request?.representation || "main")}</div></td>
        <td class="small num" style="white-space:nowrap">${esc(fmtT(fromT))}<br>${esc(fmtT(toT))}</td>
        <td class="small num" style="white-space:nowrap">${esc(fmtT(x.created_at))}${x.sha256 ? `<div class="muted">SHA ${esc(x.sha256.slice(0, 10))}…</div>` : ""}</td>
        <td>
          <span class="${stCls}" style="${x.state === "succeeded" ? "padding:2px 6px;border-radius:4px;font-weight:600" : "font-weight:600"}">${esc(EXP_STATUS[x.state] || x.state)}</span>
          ${x.state === "running" ? `<span class="small muted num"> ${pctNum}%</span><div class="meter" style="width:90px"><i style="width:${pctNum}%"></i></div>` : ""}
          ${x.error ? `<div class="small bad" style="max-width:240px">${esc(x.error)}</div>` : ""}
        </td>
        <td style="text-align:right;white-space:nowrap">
          <div class="row" style="margin:0;justify-content:flex-end;gap:5px">
            ${x.state === "succeeded" ? `
              <button class="b sm primary" data-exp-play="${esc(x.id)}" title="Reproducir clip en el navegador">▶ Reproducir</button>

    }).join("")}

  </div>`;

  $("#exp-ref").onclick = () => exportsView();
  $("#exp-new-toggle").onclick = () => { expFormOpen = !expFormOpen; exportsView(); };
  if ($("#exp-create")) {
    $("#exp-create").onclick = async () => {
      const btn = $("#exp-create"), msg = $("#exp-form-msg");
      const camera_id = $("#exp-cam").value;
      const from = new Date($("#exp-from").value), to = new Date($("#exp-to").value);
      const name = $("#exp-name").value.trim();
      if (!camera_id || Number.isNaN(from.getTime()) || Number.isNaN(to.getTime()) || to <= from) {

      btn.disabled = true;
      try {
        await api("/api/v1/exports", {
          method: "POST",
          headers: {"Content-Type": "application/json", "Idempotency-Key": Date.now().toString(36) + Math.random().toString(36).slice(2)},
          body: JSON.stringify({camera_id, from: from.toISOString(), to: to.toISOString(), name: name || undefined})
        });
        exportsView();
      } catch (e) {
        msg.innerHTML = `<span class="bad">✗ ${esc(e.message)}</span>`;
        btn.disabled = false;
      }
    };
  }

  document.querySelectorAll("[data-exp-play]").forEach(b => b.onclick = () => {
    const x = items.find(i => i.id === b.dataset.expPlay);
    if (x) openExportPlayerModal(x, camNameById[x.request?.camera_id] || x.request?.camera_id || "");
  });
  document.querySelectorAll("[data-exp-mp4]").forEach(b => b.onclick = () => {

    if (x) downloadExportFile(x, "zip", camNameById[x.request?.camera_id] || x.request?.camera_id || "", b);
  });
  document.querySelectorAll("[data-exp-cancel]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    await api(`/api/v1/exports/${encodeURIComponent(b.dataset.expCancel)}/cancel`, {method: "POST"}).catch(() => {});
    exportsView();
  });
  document.querySelectorAll("[data-exp-del]").forEach(b => b.onclick = async () => {
    if (!confirm("¿Eliminar esta exportación y su archivo generado?")) return;
    b.disabled = true;
    try {
      await api(`/api/v1/exports/${encodeURIComponent(b.dataset.expDel)}`, {method: "DELETE", raw: true});
      exportsView();
    } catch (e) {
      alert(e.message);
      b.disabled = false;
    }
  });

  if (hasActive && view === "exports") {
    expTimer = setTimeout(() => { if (view === "exports" && !authRequired) exportsView(); }, 1500);
  }
}

    </div>
    <div class="tbl-wrap"><table><thead><tr><th>Captura</th><th>Fecha / Hora</th><th>Cámara</th><th>Detección</th><th>Detalle</th><th>Origen</th><th>Acciones</th></tr></thead><tbody>
    ${items.length ? items.map(x => { const extraDets = (x.detections && x.detections.length > 1) ? x.detections.map(d => `${EV_CLASS_LABEL[d.class] || d.class || EV_LABEL[d.type] || d.type}${d.confidence ? " " + Math.round(d.confidence * 100) + "%" : ""}`).join(" + ") : ""; const zoneLbl = x.zone ? (EV_LABEL[x.zone] || x.zone) : ""; const det = [extraDets || (x.class && x.class !== x.type ? (EV_CLASS_LABEL[x.class] || x.class) : ""), zoneLbl, !extraDets && x.confidence ? Math.round(x.confidence * 100) + "%" : "", (x.detections && x.detections.length) ? `${x.detections.length} caja${x.detections.length > 1 ? "s" : ""}` : ""].filter(Boolean).join(" · "); return `<tr>
      <td>${x.snapshot ? `<img data-evsnap="${esc(x.event_id)}" data-evcam="${esc(x.camera_id)}" data-evts="${esc(x.timestamp_utc)}" data-evlbl="${esc(evMeta(x.type).label)}" data-evdet="${esc(det)}" style="width:128px;height:72px;object-fit:contain;border-radius:5px;border:1px solid var(--line2);cursor:pointer;background:#05080d;display:block">` : `<span class="muted small">—</span>`}</td>
      <td class="small num" style="white-space:nowrap">${esc(fmtT(x.timestamp_utc))}</td>
      <td class="small"><b>${esc(x.camera_id)}</b></td>
      <td>${evBadge(x.type)}</td>
      <td class="small">${esc(det || "—")}</td>
      <td class="small muted">${esc(SRC_LABEL[x.source] || x.source)}</td>
      <td><button class="b sm" data-ecam="${esc(x.camera_id)}" data-ets="${esc(x.timestamp_utc)}">Ver video</button></td>
    </tr>`; }).join("") : `<tr><td colspan="7" class="muted small">Sin eventos registrados todavía.</td></tr>`}
    </tbody></table></div>
  </div>`;
  const snapImgs = [...document.querySelectorAll("img[data-evsnap]")];
  let snapIdx = 0;
  const runSnapWorker = async () => {
    while (snapIdx < snapImgs.length && !authRequired && view === "events") {
      const img = snapImgs[snapIdx++];
      if (!img.isConnected) continue;
      try {
        const r = await api(`/api/v1/events/${encodeURIComponent(img.dataset.evsnap)}/snapshot`, {raw: true});
        const url = URL.createObjectURL(await r.blob());
        img.src = url;
        img.onclick = () => {
          const ov = document.createElement("div");
          ov.id = "ev-modal";
          ov.style.cssText = "position:fixed;inset:0;background:rgba(4,7,12,.88);backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:99;padding:20px";
          ov.innerHTML = `<div style="max-width:92vw;background:var(--s1);border:1px solid var(--line2);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--s2);border-bottom:1px solid var(--line)">
              <div><b>${esc(img.dataset.evlbl)}</b>${img.dataset.evdet ? ` <span class="small muted">· ${esc(img.dataset.evdet)}</span>` : ""}</div>
              <div class="small muted num">${esc(img.dataset.evcam)} · ${esc(fmtT(img.dataset.evts))}</div>
            </div>
            <img src="${url}" style="max-width:90vw;max-height:74vh;display:block;background:#04060a;margin:0 auto">
            <div class="row" style="padding:10px 14px;background:var(--s2);border-top:1px solid var(--line);justify-content:space-between;margin:0;gap:10px">
              <div id="ov-exp-msg" class="small"></div>
              <div class="row" style="margin:0;gap:6px">
                <a class="b sm" href="${url}" download="evento-${esc(img.dataset.evsnap)}.jpg" style="text-decoration:none">Descargar foto</a>
                <button class="b sm" id="ov-export">⬇ Exportar clip</button>
                <button class="b sm primary" id="ov-play">Reproducir en Grabado</button>
                <button class="b sm" id="ov-close">Cerrar</button>
              </div>
            </div>
          </div>`;
          const closeModal = () => { ov.remove(); document.removeEventListener("keydown", onEsc); };
          const onEsc = e => { if (e.key === "Escape") closeModal(); };
          document.addEventListener("keydown", onEsc);
          ov.onclick = e => { if (e.target === ov || e.target.id === "ov-close") closeModal(); };
          ov.querySelector("#ov-play").onclick = () => { closeModal(); openRecordedAt(img.dataset.evcam, img.dataset.evts); };
          ov.querySelector("#ov-export").onclick = async e => {
            const btn = e.currentTarget, msg = ov.querySelector("#ov-exp-msg");
            const ts = Date.parse(img.dataset.evts) || Date.now();
            btn.disabled = true;
            try {
              await api("/api/v1/exports", {
                method: "POST",
                headers: {"Content-Type": "application/json", "Idempotency-Key": Date.now().toString(36) + Math.random().toString(36).slice(2)},
                body: JSON.stringify({
                  camera_id: img.dataset.evcam,
                  from: new Date(ts - 5000).toISOString(),
                  to: new Date(ts + 55000).toISOString(),
                  name: `${img.dataset.evcam} ${fmtT(img.dataset.evts)}`
                })
              });
              msg.innerHTML = `<span class="s-healthy" style="padding:2px 7px;border-radius:4px">✓ Exportación iniciada</span> <button class="b sm" id="ov-goto-exp">Ver Exportaciones</button>`;
              ov.querySelector("#ov-goto-exp").onclick = () => { closeModal(); show("exports"); };
            } catch (err) {
              msg.innerHTML = `<span class="bad">${esc(err.message)}</span>`;
              btn.disabled = false;
            }
          };
          document.body.appendChild(ov);
        };
      } catch (e) {
        if (authRequired || e.message === "unauthorized" || e.code === "too_many_attempts") break;
        img.replaceWith(Object.assign(document.createElement("span"), {className: "muted small", textContent: "—"}));
      }
    }
  };
  Promise.all(Array.from({length: Math.min(4, snapImgs.length)}, runSnapWorker));
  $("#ev-cam").value = evFilter.cam; $("#ev-type").value = evFilter.type; $("#ev-cls").value = evFilter.cls; $("#ev-src").value = evFilter.src; $("#ev-conf").value = evFilter.conf;
  $("#ev-cam").onchange = () => { evFilter.cam = $("#ev-cam").value; eventsView(); };
  $("#ev-type").onchange = () => { evFilter.type = $("#ev-type").value; eventsView(); };
  $("#ev-cls").onchange = () => { evFilter.cls = $("#ev-cls").value; eventsView(); };
  $("#ev-src").onchange = () => { evFilter.src = $("#ev-src").value; eventsView(); };
  $("#ev-conf").onchange = () => { evFilter.conf = $("#ev-conf").value; eventsView(); };
  if ($("#ev-clr")) $("#ev-clr").onclick = () => { evFilter = {cam: "", type: "", cls: "", src: "", conf: ""}; eventsView(); };
  $("#ev-auto").onchange = () => {
    evAuto = $("#ev-auto").checked;
    if (evTimer) { clearTimeout(evTimer); evTimer = null; }
    if (evAuto) scheduleEvRefresh();
  };
  $("#ev-ref").onclick = () => eventsView();
  function scheduleEvRefresh() {
    if (evTimer) clearTimeout(evTimer);
    if (!evAuto || view !== "events") return;
    evTimer = setTimeout(() => {
      if (view !== "events" || !evAuto || authRequired) return;
      if (document.getElementById("ev-modal") || document.getElementById("nev-box")?.open) {
        scheduleEvRefresh();
        return;
      }
      eventsView();
    }, 5000);
  }
  scheduleEvRefresh();
  $("#nev-send").onclick = async () => {
    const body = {camera_id: $("#nev-cam").value, type: $("#nev-type").value, zone: $("#nev-zone").value.trim(), raw_ref: $("#nev-ref").value.trim()};
    const confRaw = $("#nev-conf").value.trim();
    if (confRaw !== "") {
      const cVal = +confRaw;
      if (!(cVal > 0 && cVal <= 100)) { $("#nev-msg").innerHTML = `<span class="bad">La confianza debe ser entre 1 y 100.</span>`; return; }
      body.confidence = cVal / 100;
    }
    const bboxRaw = $("#nev-bbox").value.trim();
    if (bboxRaw !== "") {
      const parts = bboxRaw.split(",").map(s => Number(s.trim()));
      if (parts.length !== 4 || parts.some(n => !Number.isFinite(n)) || parts[2] <= 0 || parts[3] <= 0) {
        $("#nev-msg").innerHTML = `<span class="bad">BBox inválido: usá 4 números x,y,w,h (w,h &gt; 0).</span>`;
        return;
      }
      body.bbox = parts;
    }
    if (!body.camera_id) { $("#nev-msg").innerHTML = `<span class="bad">Elegí una cámara.</span>`; return; }
    try {
      await api("/api/v1/events", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
      eventsView();
    } catch (e) { $("#nev-msg").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
  };
  document.querySelectorAll("[data-ftype]").forEach(b => b.onclick = () => {
    evFilter.type = evFilter.type === b.dataset.ftype ? "" : b.dataset.ftype;
    eventsView();
  });
  document.querySelectorAll("[data-ecam]").forEach(b => b.onclick = () => {
    openRecordedAt(b.dataset.ecam, b.dataset.ets);
  });
}

const HASH_OF = {dash: "panel", events: "eventos", exports: "exportaciones", config: "configuracion"};
const VIEW_OF = Object.assign(
  Object.fromEntries(Object.entries(HASH_OF).map(([k, v]) => [v, k])),
  {camaras: "cams", almacenamiento: "storage", sistema: "sys", grabaciones: "dash"}
);
(async () => {
  const h = location.hash.slice(1);
  if (h === "grabaciones") { wallMode = "recorded"; localStorage.setItem("ovr_wall_mode", "recorded"); }
  const initial = VIEW_OF[h] || "dash";
  view = initial;
  if (key) {
    const ok = await refreshWho();
    if (ok) show(initial);
    return;
  }
  try {
    await api("/api/v1/system/capabilities");
    show(initial);
  } catch (e) {
    if (e.message !== "unauthorized") showLogin(e.message);
  }
})();
</script>
</body>
</html>
